function openStartSheet(pid) {
  const c = compute();
  if (!c.group.includes(pid)) { toast('오늘 빠진 사람이라 시작 자리가 없어요'); return; }
  const owner = {};
  for (const [id, s] of Object.entries(c.starts)) owner[s] = id;
  const items = c.ring.map((_, j) => (c.kpos + j) % c.L).map(i => {
    const sl = c.ring[i];
    let name, sub;
    if (sl.kind === 'keeper') { name = '키퍼'; sub = '라인 맨 뒤 최종 확인'; }
    else if (sl.kind === 'side') { name = 'X'; sub = '사이드(대기)'; }
    else { name = sl.p.name; sub = `${seatText(sl)} · ${noteLabel(sl.note)}`; }
    const mine = c.starts[pid] === i;
    const who = owner[i] !== undefined ? (mine ? '지금 여기' : P.get(owner[i]).name) : '비어 있음';
    return `<button class="slot${mine ? ' cur' : ''}${sl.kind === 'keeper' ? ' k' : ''}" data-s="slot" data-v="${i}"><span class="si">${i === c.kpos ? 'K' : (((i - c.kpos) % c.L) + c.L) % c.L}</span><span class="sn"><b>${esc(name)}</b><small>${esc(sub)}</small></span><span class="sw2">${esc(who)}</span></button>`;
  }).join('');
  openSheet(`${P.get(pid).name} · 1R 시작 자리`, `<p class="hint">고른 칸에 있던 사람과 서로 바뀌어요. 칸 번호는 키퍼(K)부터 도는 순서예요. 직접 바꾸면 그날은 규칙 대신 이 배치를 써요. 키퍼 칸으로 옮기면 그 사람이 키퍼 시작이 되고 번호가 다시 붙어요.</p><div class="slots">${items}</div>`, b => {
    b.onclick = e => {
      const t = e.target.closest('[data-s="slot"]');
      if (!t) return;
      const j = +t.dataset.v;
      const ns = Object.assign({}, c.starts);
      const other = owner[j], mine = ns[pid];
      if (j === mine) { closeSheet(); return; }
      // 키퍼 칸으로 옮기거나 키퍼를 다른 사람 칸으로 옮기면 = 키퍼 시작 바꾸기(번호 다시, 다음 근무일부터 이어짐)
      const newK = j === c.kpos ? pid : mine === c.kpos && other !== undefined ? other : null;
      if (newK) { closeSheet(); setOwner(newK, `${nameOf(newK)} 키퍼 시작 · 번호를 다시 붙였어요`); return; }
      ns[pid] = j;
      if (other !== undefined && other !== pid) ns[other] = mine;
      editDay(d => { d.starts = ns; });
      closeSheet();
    };
  }, () => render());
}

function openReliefSheet(pid) {
  const c = compute();
  const list = pendIdsFor(c.d);
  const fillBy = new Map(Object.entries(c.fills).map(([sid, id]) => [id, findSeatById(sid)]));
  const groups = [
    ['릴리프', p => p.role === '릴리프'],
    ['그룹장·파트장', p => p.role === '그룹장' || p.role === '파트장'],
    ['작업자', p => p.role === '작업자'],
    ['인턴', p => p.role === '인턴'],
  ];
  const sec = groups.map(([title, f]) => {
    const ps = base.people.filter(f);
    if (!ps.length) return '';
    return `<h4>${title}</h4><div class="pgrid">${ps.map(p => {
      const inList = list.includes(p.id);
      const n = c.notes[p.id];
      const off = n && ROUNDS.every(r => n.rounds.includes(r));
      const s = SEAT.get(p.id);
      const fs = fillBy.get(p.id);
      const sub = p.id === pid ? '지금 이 사람' : inList ? (reliefIdsFor(c.d).includes(p.id) ? '오늘 릴리프' : '넣음 · 적용 전') : fs ? `오늘 대신 ${fs.seat.station}` : n ? noteLabel(n) : !internActive(p, c.k) ? '기간 아님' : s ? `${s.side} ${s.seat.station}` : p.role;
      const dis = inList || off || !!fs;
      return `<button class="pchip r-${RC[p.role]}${n ? ' has' : ''}${p.id === pid ? ' cur' : ''}" data-s="pick" data-v="${p.id}" ${dis ? 'disabled' : ''}><span class="n">${esc(p.name)}</span><span class="m">${esc(sub)}</span></button>`;
    }).join('')}</div>`;
  }).join('');
  const who = pid ? P.get(pid) : null;
  openSheet(who ? `${who.name} 바꾸기` : '릴리프 추가',
    `<p class="hint">${who ? '대신 넣을 사람을 고르세요. 번호는 출근부 자리대로 다시 매겨요.' : '더 넣을 사람을 고르세요. 그룹장·파트장·작업자·인턴도 넣을 수 있어요. 번호는 출근부 자리대로 매겨요.'} 고른 사람은 '적용 전'으로 모아 두고, 오늘 릴리프의 <b>적용</b>을 누르면 표에 들어가요. 작업자를 넣으면 그 사람 자리는 오늘 공석(!)이 되고, 빼면 제자리로 돌아가요.</p>${sec}
     ${who ? '<div class="btns"><button class="btn danger" data-s="remove">오늘 릴리프에서 빼기</button></div>' : ''}`, b => {
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t || t.disabled) return;
      if (t.dataset.s === 'remove') { closeSheet(); removeRelief(pid); return; }
      if (t.dataset.s !== 'pick') return;
      const id = t.dataset.v;
      onSheetClose = null;
      closeSheet();
      stageRoster(arr => {
        if (pid) { const i = arr.indexOf(pid); if (i >= 0) arr[i] = id; else arr.push(id); } else arr.push(id);
        return arr;
      }, pid ? `${P.get(pid).name} → ${P.get(id).name}` : `${P.get(id).name} 넣음`);
    };
  }, () => render());
}
function removeRelief(pid) {
  const p = P.get(pid);
  if (!p) return;
  stageRoster(arr => arr.filter(x => x !== pid), `${p.name} 뺌`);
}
// 사람을 넣고 빼서 오늘 키퍼 차례가 바뀌었으면 한마디
function keeperNews(o0) {
  const o1 = turnFor(ui.date);
  return o0 && o1 && o0.owner !== o1.owner ? ` · 오늘 키퍼 차례 ${nameOf(o1.owner)}` : '';
}

/* ---------- 자리표 ---------- */
function findSeat(side, sid) { return (base.seats[side] || []).find(s => s.id === sid) || null; }
function internName() {
  let n = '인턴', k = 2;
  const names = new Set(base.people.map(p => p.name));
  while (names.has(n)) n = '인턴' + (k++);
  return n;
}
/* ---------- 되돌리기 ---------- */
function snapDay(k = ui.date) { return { k, d: days[k] ? JSON.parse(JSON.stringify(days[k])) : null }; }
// 되돌리기도 새로 고친 것으로 친다(t 갱신) — 그래야 링크로 다른 폰에도 되돌린 대로 넘어간다
function restoreDay(s) {
  if (s.d) { s.d.t = Date.now(); days[s.k] = s.d; if (goneMap[s.k]) { delete goneMap[s.k]; saveGone(); } }
  else { if (days[s.k]) { goneMap[s.k] = Date.now(); saveGone(); } delete days[s.k]; }
  saveDays(); render(); toast('되돌렸어요');
}
function undoBase(before) { const b = cleanBase(JSON.parse(before)); if (b) { base = b; saveBase(); render(); toast('되돌렸어요'); } }

/* ---------- 오늘만 대신 서기 ---------- */
function fillCands(c, seat) {
  const listed = new Set(c.rows.map(r => r.id));
  const filling = new Set(Object.entries(c.fills).filter(([sid]) => sid !== seat.id).map(([, pid]) => pid));
  return base.people.filter(p => {
    if (p.role === '릴리프' || listed.has(p.id) || filling.has(p.id) || p.id === seat.pid) return false;
    const n = c.notes[p.id];
    if (n && ROUNDS.every(r => n.rounds.includes(r))) return false;
    if (!internActive(p, c.k)) return false;
    if (p.role === '작업자' || p.role === '인턴') return !SEAT.has(p.id);
    return true; // 그룹장·파트장
  });
}
function setFill(seat, pid) {
  const before = snapDay();
  editCond(d => {
    d.fills = Object.assign({}, d.fills || {});
    if (pid) d.fills[seat.id] = pid; else delete d.fills[seat.id];
  });
  render();
  toast(pid ? `${nameOf(pid)} · ${seat.station} 오늘만 대신 서요` : `${seat.station} 대신 서는 사람을 뺐어요`, () => restoreDay(before));
}
function seatStatusLine(x) {
  const o = x.owner;
  if (x.fill) return `<b>${esc(x.fill.name)}</b> 오늘 대신 서요 (${o ? `${esc(o.name)} ` : ''}${esc(x.why)}).`;
  if (x.state === 'away') return `<b>${esc(o.name)}</b> ${esc(x.why)} → 오늘 공석이에요. 대신 설 사람을 고르세요.`;
  if (x.state === 'empty') return `${esc(x.why)} → 공석이에요. 오늘 대신 설 사람을 고르거나, 아래에서 자리 주인을 정하세요.`;
  if (x.state === 'absent') return `<b>${esc(o.name)}</b> ${esc(x.why)} → 릴리프가 돌며 메워요. 여기에 오늘 대신 설 사람을 넣으면 릴리프 표에서 빠져요.`;
  return '';
}

/* ---------- 자리 고르기(명단에서) · 끌어 놓을 때 고르기 ---------- */
function assignSeat(pid, side, sid) {
  const seat = findSeat(side, sid), p = P.get(pid);
  if (!seat || !p) return;
  const before = JSON.stringify(base);
  const cur = SEAT.get(pid);
  const prev = seat.pid && P.has(seat.pid) && seat.pid !== pid ? P.get(seat.pid) : null;
  if (cur && cur.seat === seat) return;
  if (cur) cur.seat.pid = prev ? prev.id : null;
  seat.pid = pid;
  saveBase(); render();
  toast(`${p.name} → ${side} ${seat.station}${prev ? (cur ? ` (${wa(prev.name)} 자리 바꿈)` : ` (${eun(prev.name)} 자리 없음)`) : ''}`, () => undoBase(before));
}
function openSeatPicker(pid, isNew) {
  const p = P.get(pid);
  if (!p) return;
  const cur = SEAT.get(pid);
  const col = side => base.seats[side].map(s => {
    const o = s.pid && P.has(s.pid) ? P.get(s.pid) : null;
    const h = !o ? homeOwner(s.id) : null;

        saveBase(); closeSheet(); toast(`${p.name} 명단에서 뺐어요`);
      }
    };
  }, () => render());
}

/* ---------- 코드로 명단 나누기 ---------- */
function toB64url(str) {
  const bytes = new TextEncoder().encode(str);

}
function fromB64url(s) {

  const bin = atob(b);
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}
function encodeBase() {
  const idx = new Map(base.people.map((p, i) => [p.id, i]));
  const seat = s => [s.station, s.tag, s.hold ? 1 : 0, s.pid && idx.has(s.pid) ? idx.get(s.pid) : -1];
  const today = workDayKey(), o = turnCache().first ? ownerAt(today) : null;
  const a = o && o.owner ? { date: today, pid: o.owner } : null; // 받는 사람은 들어온 사람 기록이 없으니 오늘 차례를 기준으로
  const homes = [];
  base.people.forEach((p, i) => {
    if (!p.home) return;
    for (const [k, side] of [['R', 'RH'], ['L', 'LH']]) { const j = base.seats[side].findIndex(st => st.id === p.home); if (j >= 0) homes.push([i, k, j]); }
  });
  const obj = { v: 1, r: base.rotation, p: base.people.map(p => (p.role === '인턴' && (p.from || p.to) ? [p.name, ROLES.indexOf(p.role), p.from || '', p.to || ''] : [p.name, ROLES.indexOf(p.role)])), s: { R: base.seats.RH.map(seat), L: base.seats.LH.map(seat) }, h: homes,
    t: a && idx.has(a.pid) ? [a.date, idx.get(a.pid)] : null, w: base.shift ? [base.shift.week, base.shift.kind] : null, b: base.backup && idx.has(base.backup) ? idx.get(base.backup) : -1 };
  return 'RLF1.' + toB64url(JSON.stringify(obj));
}
function decodeCode(text) {

  let obj;

  if (!obj || obj.v !== 1 || !Array.isArray(obj.p) || !obj.s || !Array.isArray(obj.s.R) || !Array.isArray(obj.s.L)) throw new Error('명단 코드 형식이 아니에요');
  const oldId = new Map(base.people.map(p => [p.name, p.id]));
  const usedIds = new Set();
  const people = [];
  for (const it of obj.p) {
    if (!Array.isArray(it)) continue;
    const name = String(it[0] || '').trim().slice(0, 12);
    if (!name || people.some(p => p.name === name)) continue;
    let id = oldId.get(name);
    if (!id || usedIds.has(id)) id = uid() + people.length;
    usedIds.add(id);
    const np = { id, name, role: ROLES[it[1]] || '작업자' };
    if (np.role === '인턴') { if (/^\d{4}-\d{2}-\d{2}$/.test(String(it[2] || ''))) np.from = it[2]; if (/^\d{4}-\d{2}-\d{2}$/.test(String(it[3] || ''))) np.to = it[3]; }

  }
  const mapSeat = (side, arr) => arr.filter(Array.isArray).map((it, i) => ({
    id: side + '-' + i + '-' + Math.random().toString(36).slice(2, 6),
    station: String(it[0] || '').slice(0, 20), tag: String(it[1] || '').slice(0, 12), hold: !!it[2],
    pid: Number.isInteger(it[3]) && it[3] >= 0 && obj.p[it[3]] ? (people.find(p => p.name === String(obj.p[it[3]][0] || '').trim()) || {}).id || null : null,

function tableText() {
  const c = compute();
  const out = [`[릴리프 업무표] ${fmtDay(ui.date)}${workMark(ui.date) === 'on' ? ' 특근' : ''}`];
  if (c.starter && c.starter.id) out.push(`키퍼 시작: ${nameOf(c.starter.id)}${c.starter.sub && c.turn ? ` (${nameOf(c.turn.owner)} 차례 대신)` : c.turn && c.turn.set ? ' (직접 정함)' : ''}`);
  const noteItems = base.people.filter(p => c.notes[p.id]).map(p => `${p.name} ${noteLabel(c.notes[p.id])}`);
  out.push(noteItems.length ? `특이사항: ${noteItems.join(' · ')}` : '특이사항: 없음');
  out.push('', '1R → 2R → 3R → 4R');

    if (!g.cells) { out.push(`${g.row.p.name}: ${noteLabel(g.row.note)} (오늘 빠짐)`); continue; }
    out.push(`${g.row.p.name}(${g.n}): ${g.cells.map(cellText).join(' → ')}`);
  }

  if (gl.length) out.push('', `못 메운 자리: ${gl.join(' / ')}`);
  const ns = needSeats(c);
  if (ns.length) out.push(`채워야 할 자리: ${ns.map(x => `${x.side} ${x.seat.station}(${x.owner ? x.owner.name + ' ' : ''}${x.why})`).join(', ')}`);
  const fl = Object.entries(c.fills).map(([sid, pid]) => { const f = findSeatById(sid); return f ? `${f.side} ${f.seat.station} ${nameOf(pid)}` : ''; }).filter(Boolean);
  if (fl.length) out.push(`오늘 대신: ${fl.join(', ')}`);

  return out.join('\n');
}

const B64 = {

async function packLink(pkt) {

async function unpackLink(text) {

function idMaps(from, to) {

/* ---------- 업무표 사진 (종이 표처럼 굵은 격자, 밝은 색으로 고정) ---------- */
const IMG = { bg: '#FFFFFF', ink: '#15202B', muted: '#596572', line: '#CDD4DB', frame: '#15202B', keeper: '#0B6E5A', keeperBg: '#D8EFE8', absent: '#B0361F', absentBg: '#FBE3DC', side: '#66717C', sideBg: '#E3E7EB', mark: '#D2A600' };

async function tableCanvas(c) {

  const noteIds = base.people.filter(p => c.notes[p.id]).map(p => p.id);
  const foot = [];
  const gl = c.gaps.map((m, i) => (m.length ? `${i + 1}R ${m.map(z => (z.kind === 'keeper' ? '키퍼' : z.p.name)).join(',')}` : '')).filter(Boolean);
  if (gl.length) foot.push([IMG.absent, `못 메운 자리: ${gl.join(' / ')}`]);

  if (ns.length) foot.push([IMG.absent, `! 채워야 할 자리: ${ns.map(z => `${z.side} ${z.seat.station}(${z.owner ? z.owner.name + ' ' : ''}${z.why})`).join(', ')}`]);

  x.font = `600 20px ${F}`; x.textAlign = 'right';
  x.fillText(fmtDay(ui.date), W - pad, pad + 24);

  }

}
