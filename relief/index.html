<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>릴리프 업무표</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="릴리프표">
<meta name="application-name" content="릴리프표">
<meta name="theme-color" content="#F4C400">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 폰 한 손 조작. 위에 제목·탭 고정, 아래로 카드(날짜 → 특이사항 → 오늘 릴리프 → 업무표 → 라운드마다 한 칸씩 → 돌아가는 근거).
   업무표와 자리표는 종이 로테이션표처럼 굵은 테두리 격자, 고른 것은 안전 노랑으로 표시.
   돌아가는 근거의 원 그림은 손으로 그리는 원(키퍼 아래, 화살표 방향으로 한 칸씩)을 그대로 옮긴 것.
   v3: 탭 4개(업무표·자리표·명단·달력). 칸은 길게 눌러 끌어 옮기고, 채워야 할 자리는 빨간 느낌표(!) */
:root{
  --bg:#ECEFF2;
  --card:#FFFFFF;
  --ink:#15202B;
  --muted:#596572;
  --line:#CDD4DB;
  --frame:#15202B;
  --accent:#F4C400;
  --on-accent:#15202B;
  --accent-bg:#FFF6CF;
  --accent-line:#D2A600;
  --keeper:#0B6E5A;
  --keeper-bg:#D8EFE8;
  --absent:#B0361F;
  --absent-bg:#FBE3DC;
  --on-absent:#FFFFFF;
  --side:#66717C;
  --side-bg:#E3E7EB;
  --hold:#E2E6EA;
  --scrim:rgba(13,19,25,.48);
  --focus:#1D5FD1;
  --shadow:0 -6px 30px rgba(13,19,25,.18);
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --card:#161D25; --ink:#E6EBF0; --muted:#98A4B0; --line:#2A3440; --frame:#C9D3DD;
    --accent:#F4C400; --on-accent:#15202B; --accent-bg:#2C2711; --accent-line:#B59300; --keeper:#5BD0B1; --keeper-bg:#0F3A31; --absent:#FF8C74; --absent-bg:#3A1C16; --on-absent:#2A0E08;
    --side:#8E99A5; --side-bg:#212A33; --hold:#1E2630; --scrim:rgba(0,0,0,.6); --focus:#8DB4FF; --shadow:0 -6px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --card:#161D25; --ink:#E6EBF0; --muted:#98A4B0; --line:#2A3440; --frame:#C9D3DD;
  --accent:#F4C400; --on-accent:#15202B; --accent-bg:#2C2711; --accent-line:#B59300; --keeper:#5BD0B1; --keeper-bg:#0F3A31; --absent:#FF8C74; --absent-bg:#3A1C16; --on-absent:#2A0E08;
  --side:#8E99A5; --side-bg:#212A33; --hold:#1E2630; --scrim:rgba(0,0,0,.6); --focus:#8DB4FF; --shadow:0 -6px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--card)}
h1,h2,h3,h4,p,ul,ol{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* 머리 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top-wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand small{font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resetbtn{min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:6px;font-size:14px;font-weight:600;flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{min-height:44px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;text-align:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* 본문 */
.main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.stack{display:grid;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 12px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:700;letter-spacing:-.2px;text-wrap:balance}
.card h3{font-size:15px;font-weight:700}
.count{font-family:var(--font-num);font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.hint{font-size:13.5px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink)}

/* 버튼 */
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 14px;border-radius:6px;border:1.5px solid var(--frame);font-weight:600;font-size:15px;background:var(--card);color:var(--ink);text-align:center}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px}
.btn.primary{background:var(--frame);color:var(--card)}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--absent);color:var(--absent)}
.btn.wide{flex:1 1 100%;width:100%}
.btn:disabled{opacity:.45}

/* 날짜 */
.datebar{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dn{font-size:28px;line-height:1;min-height:58px;text-align:center;color:var(--ink)}
.dn:active{background:var(--side-bg)}
.dpick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:58px}
.dmain{font-family:var(--font-num);font-weight:600;font-size:19px;letter-spacing:.2px}
.dsub{font-size:12px;color:var(--muted)}
.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.notday{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--absent);padding:0 4px}

/* 특이사항 요약 */
.notes{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;align-items:stretch;border:1px solid var(--absent);background:var(--absent-bg);border-radius:6px;overflow:hidden;font-size:14px;max-width:100%}
.nchip .ne{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;padding:5px 8px 5px 10px;min-height:38px;color:var(--absent);font-weight:600;min-width:0}
.nchip .ne b{color:var(--ink);font-weight:700}
.nchip .ne small{color:var(--muted);font-size:12px;font-weight:500}
.nchip .nx{width:38px;flex:none;border-left:1px solid var(--absent);color:var(--absent);font-size:15px;text-align:center}
.noempty{font-size:14px;color:var(--muted)}

/* 업무표 */
.need{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted)}
.need b{color:var(--ink);font-family:var(--font-num)}
.pill{font-weight:700;border-radius:4px;padding:2px 8px;font-size:12.5px}
.pill.ok{background:var(--keeper-bg);color:var(--keeper)}
.pill.bad{background:var(--absent-bg);color:var(--absent)}
.pill.side{background:var(--side-bg);color:var(--side)}
.tbl-wrap{border:2px solid var(--frame);border-radius:6px;overflow-x:auto;background:var(--card)}
.duty{width:100%;min-width:250px;border-collapse:collapse;table-layout:fixed;border-style:hidden;font-variant-numeric:tabular-nums}
.duty col.who{width:21%}
.duty th,.duty td{border:1px solid var(--line);padding:5px 3px;text-align:center;vertical-align:middle;overflow-wrap:anywhere;word-break:keep-all}
.duty thead th{background:var(--frame);color:var(--card);font-family:var(--font-num);font-size:13px;font-weight:600;padding:7px 2px;border-color:var(--frame)}
.duty tbody th{font-weight:700;font-size:14px;text-align:left;padding-left:7px;line-height:1.2}
.duty tbody th small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
.duty td .nm{display:block;font-weight:700;font-size:14px;line-height:1.2}
.duty td .st{display:block;font-size:10.5px;color:var(--muted);line-height:1.2;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.duty td.k{background:var(--keeper-bg);color:var(--keeper)}
.duty td.x{background:var(--side-bg);color:var(--side)}
.duty td.x .nm{font-family:var(--font-num);font-weight:600}
.duty td.a{background:var(--absent-bg);color:var(--absent)}
.duty td.a .nm{font-size:13px}
.duty td.c .nm{color:var(--ink)}
.duty td.first{padding:0}
.startbtn{width:100%;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 3px;text-align:center}
.startbtn::after{content:"▾";font-size:9px;line-height:1;color:var(--muted);margin-top:2px}
.duty td.offday{font-weight:600;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.sw.k{background:var(--keeper-bg);border-color:var(--keeper)}
.sw.c{background:var(--card);border-color:var(--frame)}
.sw.x{background:var(--side-bg)}
.sw.a{background:var(--absent-bg);border-color:var(--absent)}
.order{font-size:13px;color:var(--muted);line-height:1.6}
.order b{color:var(--ink);font-weight:600}
.warn{border:1px solid var(--absent);background:var(--absent-bg);border-radius:6px;padding:10px 12px;font-size:14px;display:grid;gap:4px}
.warn strong{color:var(--absent)}
.warn ul{padding-left:18px}
.tblempty{border:1px dashed var(--line);border-radius:6px;padding:18px 12px;text-align:center;color:var(--muted);font-size:14px}

/* 오늘 릴리프 */
.rlist{list-style:none;padding:0;display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:22px minmax(0,1fr) 44px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 10px}
.rnum{font-family:var(--font-num);color:var(--muted);font-size:13px}
.rname{min-height:44px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.rname b{font-size:16px}
.rname small{font-size:12px;color:var(--muted);line-height:1.3}
.rx{width:44px;height:44px;border-radius:6px;color:var(--muted);font-size:16px;text-align:center}

/* 사람 고르기 */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pchip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:4px 2px;text-align:center;min-width:0}
.pchip .n{font-weight:700;font-size:15px;line-height:1.2}
.pchip .m{font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip.r-gl .m,.pchip.r-jl .m{color:var(--ink);font-weight:600}
.pchip.r-rf{border-color:var(--keeper)}
.pchip.r-rf .m{color:var(--keeper);font-weight:600}
.pchip.r-it .m{color:var(--side)}
.pchip.has{background:var(--absent-bg);border-color:var(--absent)}
.pchip.has .m{color:var(--absent);font-weight:700}
.pchip.cur{border:2px solid var(--frame)}
.pchip:disabled{opacity:.4}
.sheet-b h4{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin-top:4px}

/* 특이사항 넣기 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);font-weight:600;font-size:15px;text-align:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--on-accent);color:var(--on-accent)}
.roundrow{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--frame);border-radius:6px;overflow:hidden}
.seg button{min-height:40px;font-family:var(--font-num);font-weight:600;font-size:14px;border-left:1.5px solid var(--frame);text-align:center}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--frame);color:var(--card)}
.sel{font-size:13.5px;color:var(--muted)}
.sel b{color:var(--ink)}
.last{font-size:13px;font-weight:600;color:var(--keeper)}

/* 자리표 */
.seatcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.scol{display:flex;flex-direction:column;border:2px solid var(--frame);border-radius:6px;overflow:hidden;min-width:0;background:var(--card)}
.scol-h{background:var(--frame);color:var(--card);font-family:var(--font-num);font-weight:600;text-align:center;padding:6px 4px;font-size:14px}
.scol-h small{font-family:var(--font-ui);font-weight:500;font-size:11.5px;margin-left:4px;opacity:.85}
.seat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 6px;align-items:center;text-align:left;padding:7px 8px;min-height:56px;border-top:1px solid var(--line);background:var(--card)}
.seat:first-of-type{border-top:0}
.seat .st{grid-column:1;font-size:11.5px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.seat .nm{grid-column:1;font-size:15.5px;font-weight:700;line-height:1.2}
.seat .nm.empty{color:var(--muted);font-weight:500;font-size:14px}
.seat .nm em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--side);margin-left:4px}
.seat .tg{grid-column:2;grid-row:1 / span 2;font-family:var(--font-num);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.seat.hold{background:var(--hold)}
.addseat{border-top:1px dashed var(--line);min-height:42px;font-size:13px;color:var(--muted);text-align:center;margin-top:auto}
.keeperbar{grid-column:1 / -1;border:2px solid var(--keeper);background:var(--keeper-bg);color:var(--keeper);border-radius:6px;padding:10px 12px;display:grid;gap:2px;text-align:center}
.keeperbar b{font-size:16px}
.keeperbar span{font-size:12.5px;color:var(--ink)}
.linkbtn{font-size:14px;font-weight:600;color:var(--ink);border-bottom:1.5px solid var(--accent);padding:2px 0}

/* 명단 */
.roster{list-style:none;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.roster li+li{border-top:1px solid var(--line)}
.ritem{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;min-height:52px;width:100%;text-align:left;background:var(--card)}
.rk{font-family:var(--font-num);color:var(--muted);font-size:13px}
.rn{min-width:0}
.rn b{font-size:16px}
.rn small{display:block;font-size:12px;color:var(--muted)}
.rtag{font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;border:1px solid var(--line);white-space:nowrap}
.rtag.r-gl,.rtag.r-jl{background:var(--frame);color:var(--card);border-color:var(--frame)}
.rtag.r-rf{background:var(--keeper-bg);color:var(--keeper);border-color:transparent}
.rtag.r-it{background:var(--side-bg);color:var(--side);border-color:transparent}

/* 시트 */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:14px 14px 0 0;box-shadow:var(--shadow);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 8px;border-bottom:1px solid var(--line)}
.sheet-h,.sheet-b{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h h3{font-size:17px;font-weight:700;min-width:0}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding-block:12px 20px;display:grid;gap:12px;align-content:start}
.sheet-h>*,.sheet-b>*{width:100%;max-width:688px;margin-left:auto;margin-right:auto}
.sheet-h>h3{width:auto;margin:0}
.sheet-h{max-width:none}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:54px}
.slot.cur{border:2px solid var(--frame)}
.slot .si{font-family:var(--font-num);font-weight:600;color:var(--muted);text-align:center}
.slot .sn{min-width:0}
.slot .sn b{display:block;font-size:15px}
.slot .sn small{display:block;font-size:12px;color:var(--muted)}
.slot .sw2{font-size:12.5px;color:var(--muted);text-align:right}
.slot.k .sn b{color:var(--keeper)}
.field{display:grid;gap:6px}
.field>span{font-size:13px;color:var(--muted);font-weight:700}
.field input,.inrow input,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--card);font-size:16px}
textarea{font-family:var(--font-num);font-size:13px;line-height:1.4;resize:vertical;word-break:break-all}
.inrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:15px;min-height:40px}
.check input{width:20px;height:20px}
details.more{border:1px solid var(--line);border-radius:8px;padding:0 12px}
details.more summary{min-height:46px;display:flex;align-items:center;font-weight:600;font-size:14.5px;cursor:pointer}
details.more .in{display:grid;gap:10px;padding-bottom:12px}
.choice{display:grid;gap:6px}
.preview{border:1px solid var(--keeper);background:var(--keeper-bg);border-radius:6px;padding:10px 12px;font-size:14px}
.hist{display:grid;gap:6px}
.hist button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:0 12px;min-height:48px;text-align:left}
.hist button.cur{border:2px solid var(--frame)}
.hist small{color:var(--muted);font-size:12.5px}

    <div class="updbar" id="updBar" role="status" hidden><span>새 판(<b id="updVer"></b>)이 나왔어요. 새로고침하면 바로 바뀌어요.</span><button class="btn sm primary" data-act="reload">새로고침</button></div>

<script>
(() => {
'use strict';

/* ================= 기본 설정 ================= */
const ROLES = ['그룹장', '파트장', '릴리프', '작업자', '인턴'];
const RC = { '그룹장': 'gl', '파트장': 'jl', '릴리프': 'rf', '작업자': 'wk', '인턴': 'it' };
// 특이사항 종류와 처음에 골라 둘 라운드 (검진 = 종일, 검진확인 = 2R 끝나고 나감)
// N R조퇴 = 그 라운드까지 일하고 빠짐 (2R조퇴 = 1R·2R 근무, 3R부터 빈자리)
const TYPES = [
  ['연차', [1, 2, 3, 4]], ['월차', [1, 2, 3, 4]], ['1R조퇴', [2, 3, 4]], ['2R조퇴', [3, 4]], ['3R조퇴', [4]],
  ['검진', [1, 2, 3, 4]], ['검진확인', [3, 4]], ['교육', [1, 2, 3, 4]], ['경조', [1, 2, 3, 4]], ['기타', [1, 2, 3, 4]],
];
const LEAVE_TYPES = ['연차', '월차'];
const LEAVE_MAX = 5; // 연·월차는 하루 최대 5명 (릴리프 연·월차도 포함)
const TYPE_DEF = Object.fromEntries([...TYPES, ['조퇴', [3, 4]]]); // 예전 기록의 '조퇴'도 읽는다
const ROUNDS = [1, 2, 3, 4];
const KEEP_DAYS = 40;
const KEY = { base: 'relief.base.v1', days: 'relief.days.v1', ui: 'relief.ui.v1', sync: 'relief.sync.v1', gone: 'relief.gone.v1' };
const APP_VER = '7.1';   // 앱 판. 공개 주소의 version.json이 더 새 판이면 '새로고침' 알림
const ALGO_VER = '6.2';  // 표 짜는 규칙(계산)의 판. 기록에 '앱이 짠 표'와 함께 남긴다
// 단톡방 링크는 늘 공개 주소로 만든다(본인용 화면에서 보내도 동료는 브라우저로 바로 연다)
const PUBLIC_URL = 'https://vera-architect.github.io/work-car/relief/';

// 기본 명단: 출근부 순서. 공개 주소에 올릴 때는 DEFAULTS = null 로 바꾸고 명단은 코드로 나눈다.
// turn = 키퍼 순번 기준(그날 순번 주인), backup = 인원이 모자랄 때 먼저 넣을 사람
const DEFAULTS = null; // 공개본: 이름 없음. 명단은 '코드 불러오기'로 넣는다

/* ================= 작은 도구 ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const sameArr = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((x, i) => x === b[i]);
const sortNum = a => a.slice().sort((x, y) => x - y);
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
// 야간 근무는 자정을 넘기므로 새벽 3시 전에는 전날을 근무일로 본다
const workDayKey = () => { const d = new Date(); if (d.getHours() < 3) d.setDate(d.getDate() - 1); return keyOf(d); };
const fmtDay = k => { const d = parseKey(k); return `${d.getMonth() + 1}.${d.getDate()} (${DOW[d.getDay()]})`; };

function fmtRounds(rs) {
  const a = sortNum(rs || []);
  if (!a.length || a.length === ROUNDS.length) return '';
  if (a.length === 1) return `${a[0]}R`;
  if (a[a.length - 1] - a[0] === a.length - 1) return `${a[0]}~${a[a.length - 1]}R`;
  return a.join('·') + 'R';
}
// 'N R조퇴'는 이름에 라운드가 들어 있어서, 기본 라운드면 따로 붙이지 않는다
const roundsTxt = n => (/^\dR조퇴$/.test(n.type) && TYPE_DEF[n.type] && sameArr(sortNum(n.rounds || []), TYPE_DEF[n.type]) ? '' : fmtRounds(n.rounds));
const noteLabel = n => n ? `${n.type}${roundsTxt(n) ? ' ' + roundsTxt(n) : ''}${n.memo ? ` (${n.memo})` : ''}` : '';

/* ================= 저장 ================= */
const store = (() => {
  let ok = true;
  try { localStorage.setItem('__relief_t', '1'); localStorage.removeItem('__relief_t'); } catch (e) { ok = false; }
  return {
    get ok() { return ok; },
    get(k) { if (!ok) return null; try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { if (!ok) return false; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  };
})();

function defaultBase() {
  if (!DEFAULTS) return { v: 3, rotation: '', people: [], seats: { RH: [], LH: [] }, turn: null, backup: null, t: 0 };
  const people = DEFAULTS.people.map(([name, role], i) => ({ id: 'p' + (i + 1), name, role }));
  const idOf = new Map(people.map(p => [p.name, p.id]));
  const seats = {};
  for (const side of ['RH', 'LH']) {
    seats[side] = DEFAULTS.seats[side].map(([station, tag, name, hold], i) => ({ id: side + (i + 1), station, tag: tag || '', hold: !!hold, pid: idOf.get(name) || null }));
  }
  const turn = DEFAULTS.turn && idOf.get(DEFAULTS.turn[1]) ? { date: DEFAULTS.turn[0], pid: idOf.get(DEFAULTS.turn[1]) } : null;
  const backup = DEFAULTS.backup ? idOf.get(DEFAULTS.backup) || null : null;
  const shift = DEFAULTS.shift ? { week: DEFAULTS.shift[0], kind: DEFAULTS.shift[1] } : null;
  return { v: 3, rotation: DEFAULTS.rotation, people, seats, turn, backup, shift, t: 0 };
}
// v1(조장)·v2도 받아서 v3로 옮긴다. v3: 인턴 기간(from·to), 비워 둔 원래 자리(home)
function cleanBase(b) {
  if (!b || ![1, 2, 3].includes(b.v) || !Array.isArray(b.people) || !b.seats || !Array.isArray(b.seats.RH) || !Array.isArray(b.seats.LH)) return null;
  const old = b.v === 1;
  const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  // (v7) id는 영문·숫자·-·_ 만(링크로 받은 명단도 거른다)
  const idOk = v => typeof v === 'string' && /^[A-Za-z0-9_-]{1,60}$/.test(v) && !['__proto__', 'constructor', 'prototype'].includes(v);
  const seen = new Set();
  let people = b.people.filter(p => p && idOk(p.id) && typeof p.name === 'string' && p.name.trim() && (ROLES.includes(p.role) || p.role === '조장') && !seen.has(p.id) && seen.add(p.id))
    .map(p => {
      const o = { id: p.id, name: p.name.slice(0, 20), role: p.role === '조장' ? '파트장' : p.role };
      if (o.role === '인턴') { if (isDate(p.from)) o.from = p.from; if (isDate(p.to)) o.to = p.to; }
      if (typeof p.home === 'string') o.home = p.home;
      return o;
    });
  const seats = {};
  for (const side of ['RH', 'LH']) {
    seats[side] = b.seats[side].filter(s => s && idOk(s.id))
      .map(s => ({ id: s.id, station: String(s.station || '').slice(0, 20), tag: String(s.tag || '').slice(0, 12), hold: !!s.hold, pid: typeof s.pid === 'string' ? s.pid : null }));
  }
  const allSeats = [...seats.RH, ...seats.LH];
  const seatIds = new Set(allSeats.map(st => st.id)), seatedIds = new Set(allSeats.map(st => st.pid).filter(Boolean));
  people.forEach(p => { if (p.home && (!seatIds.has(p.home) || seatedIds.has(p.id))) delete p.home; });
  const ids = new Set(people.map(p => p.id));
  const byName = n => (people.find(p => p.name === n) || {}).id || null;
  let turn = b.turn && typeof b.turn === 'object' && isDate(b.turn.date) && ids.has(b.turn.pid) ? Object.assign({ date: b.turn.date, pid: b.turn.pid }, b.turn.exact ? { exact: true } : {}) : null;
  if (!turn && old && DEFAULTS && DEFAULTS.turn && byName(DEFAULTS.turn[1])) turn = { date: DEFAULTS.turn[0], pid: byName(DEFAULTS.turn[1]) };
  let backup = typeof b.backup === 'string' && ids.has(b.backup) ? b.backup : null;
  if (old && !backup && DEFAULTS && DEFAULTS.backup) backup = byName(DEFAULTS.backup);
  let shift = b.shift && isDate(b.shift.week) && (b.shift.kind === '주간' || b.shift.kind === '야간') ? { week: b.shift.week, kind: b.shift.kind } : null;
  if (!shift && b.v !== 3 && DEFAULTS && DEFAULTS.shift) shift = { week: DEFAULTS.shift[0], kind: DEFAULTS.shift[1] };
  // (v7) t = 명단·자리표를 마지막으로 고친 시각. 단톡방 링크를 받을 때 어느 쪽이 새 것인지 가린다
  const t = Number(b.t) > 0 ? Number(b.t) : 0;
  return { v: 3, rotation: String(b.rotation || '').slice(0, 20), people, seats, turn, backup, shift, t };
}

const storedBase = store.get(KEY.base);
let base = cleanBase(storedBase) || defaultBase();
const baseMigrated = !!(storedBase && storedBase.v !== 3 && base.v === 3);
let days = store.get(KEY.days);
if (!days || typeof days !== 'object' || Array.isArray(days)) days = {};
// v5 → v6: '오늘만 키퍼'(kstart)는 그날 차례(turn)로 옮긴다. 다음 근무일부터 그 사람 다음으로 이어진다
{
  let moved = false;
  for (const d of Object.values(days)) {
    if (!d || typeof d !== 'object' || !d.kstart) continue;
    if (!d.turn) d.turn = d.kstart;
    delete d.kstart; moved = true;
  }
  if (moved) store.set(KEY.days, days);
}
const uiSaved = store.get(KEY.ui) || {};
const TABS = ['table', 'seats', 'roster', 'cal'];
const ui = { tab: TABS.includes(uiSaved.tab) ? uiSaved.tab : 'table', date: workDayKey(), type: '연차', rounds: [1, 2, 3, 4], ringR: 1, calMonth: '', pick: null };

let P = new Map();     // id → 사람
let SEAT = new Map();  // 사람 id → { side, seat, i }
function reindex() {
  P = new Map(base.people.map(p => [p.id, p]));
  SEAT = new Map();
  for (const side of ['RH', 'LH']) base.seats[side].forEach((s, i) => { if (s.pid && P.has(s.pid) && !SEAT.has(s.pid)) SEAT.set(s.pid, { side, seat: s, i }); });
}
reindex();
if (baseMigrated) store.set(KEY.base, base);

let DATA_VER = 0; // 기록이 바뀔 때마다 올라간다 → 키퍼 순번 셈을 새로 한다
let warnedFull = false;
function persist(k, v) {
  if (!store.set(k, v) && store.ok && !warnedFull) { warnedFull = true; toast('저장 공간이 부족해서 저장하지 못했어요'); }
}
// auto = 사람이 고친 게 아니라 앱이 스스로 옮긴 것(40일 지우기·링크 받기) → 고친 시각(t)은 그대로
function saveBase(auto) { if (!auto) base.t = Date.now(); persist(KEY.base, base); reindex(); DATA_VER++; }
function saveDays() { persist(KEY.days, days); DATA_VER++; }
// (v7) 단톡방 링크: me = 내 이름, in = 마지막으로 받은 링크 {by, at, k}, out = 마지막으로 보낸 링크 {at, k}
let sync = store.get(KEY.sync);
if (!sync || typeof sync !== 'object' || Array.isArray(sync)) sync = {};
function saveSync() { persist(KEY.sync, sync); }
// (v7) 지운 날: 날짜 → 지운 시각. 링크에 같이 실어서 다른 폰에서도 지워지게 한다
let goneMap = store.get(KEY.gone);
if (!goneMap || typeof goneMap !== 'object' || Array.isArray(goneMap)) goneMap = {};
function saveGone() { persist(KEY.gone, goneMap); }

// 40일 지난 기록은 지운다. 지워지는 날(직접 맞춘 순번·특근·휴무·주말 기록) 때문에 순번 셈이 달라지지 않게
// 남는 첫날 기준으로 순번을 먼저 옮겨 둔다. (순번 계산을 쓰므로 맨 아래 render 앞에서 부른다)
function purge() {
  const cutoff = addDays(workDayKey(), -KEEP_DAYS);
  const ok = k => /^\d{4}-\d{2}-\d{2}$/.test(k) && !!days[k] && typeof days[k] === 'object';
  const bad = Object.keys(days).filter(k => !ok(k)), old = Object.keys(days).filter(k => ok(k) && k < cutoff);
  const goneOld = Object.keys(goneMap).filter(k => !/^\d{4}-\d{2}-\d{2}$/.test(k) || k < cutoff);
  if (goneOld.length) { goneOld.forEach(k => { delete goneMap[k]; }); saveGone(); }
  if (!bad.length && !old.length) return;
  bad.forEach(k => { delete days[k]; });
  if (old.length) {
    const T = turnCache();
    if (T.first && T.first < cutoff && (!base.turn || base.turn.date < cutoff)) {
      const o = ownerAt(cutoff);
      if (o && o.owner) { base.turn = { date: cutoff, pid: o.owner, exact: true }; saveBase(true); } // 다 센 값이라 그날 그대로(exact)
    }
    old.forEach(k => { delete days[k]; });
  }
  saveDays();
}

const defaultReliefIds = () => base.people.filter(p => p.role === '릴리프').map(p => p.id);
function reliefIdsFor(d) {
  const src = d && Array.isArray(d.reliefs) ? d.reliefs : defaultReliefIds();
  const seen = new Set();
  return src.filter(id => P.has(id) && !seen.has(id) && seen.add(id));
}
// 적용 전(바꿔 둔) 릴리프 명단 days[날짜].pend. 없으면 지금 적용된 명단
function pendIdsFor(d) {
  if (!d || !Array.isArray(d.pend)) return reliefIdsFor(d);
  const seen = new Set();
  return d.pend.filter(id => P.has(id) && !seen.has(id) && seen.add(id));
}
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
function pendDiff(d) {
  const now = reliefIdsFor(d), next = pendIdsFor(d);
  return { now, next, add: next.filter(id => !now.includes(id)), del: now.filter(id => !next.includes(id)) };
}
// 업무 중(오늘 2R~4R)이면 그 라운드, 아니면 0
const midRound = k => { if (k !== workDayKey()) return 0; const r = curRound(k); return r >= 2 && r <= 4 ? r : 0; };
function editDay(fn, opts) {
  const k = ui.date;
  const had = !!days[k];
  const d = days[k] || { notes: {} };
  if (!d.notes || typeof d.notes !== 'object') d.notes = {};
  if (opts && opts.cond) snapPlan(k, d);
  fn(d);
  if (Array.isArray(d.reliefs) && sameArr(reliefIdsFor(d), defaultReliefIds())) delete d.reliefs;
  if (d.pend !== undefined && (!Array.isArray(d.pend) || sameSet(pendIdsFor(d), reliefIdsFor(d)))) delete d.pend;
  if (d.starts && !Object.keys(d.starts).length) delete d.starts;
  if (d.fills && (typeof d.fills !== 'object' || !Object.keys(d.fills).length)) delete d.fills;
  if (d.swaps && (typeof d.swaps !== 'object' || !Object.values(d.swaps).some(a => Array.isArray(a) && a.length))) delete d.swaps;
  if (d.work !== 'on' && d.work !== 'off') delete d.work;
  delete d.kstart; // v5 '오늘만 키퍼'는 v6부터 그날 차례(turn)로 친다
  if (d.ring !== undefined && (!Array.isArray(d.ring) || !d.ring.length)) delete d.ring;
  if (!d.turn) delete d.turn;
  if (d.opt !== undefined && !['two', 'side', 'side2', 'old'].includes(d.opt)) delete d.opt;
  const empty = !d.opt && !Object.keys(d.notes).length && !Array.isArray(d.reliefs) && !Array.isArray(d.pend) && !d.starts && !d.turn && !d.fills && !d.swaps && !d.plan && !d.sent && !d.work && !d.ring;
  if (empty) {
    delete days[k];
    if (had) { goneMap[k] = Date.now(); saveGone(); } // 지운 날도 링크로 다른 폰에 알린다
  } else {
    d.t = Date.now(); days[k] = d;
    if (goneMap[k]) { delete goneMap[k]; saveGone(); }
    // (v7) 이 날 앱이 규칙대로 짠 표와 실제로 쓰는 표를 남긴다(기록 내보내기 · 알고리즘 고칠 때 비교용)
    DATA_VER++;
    try { d.snap = takeSnap(k); } catch (e) { delete d.snap; }
  }
  saveDays();
}

// 특이사항·릴리프·대신 서기처럼 '조건'이 바뀌는 수정
const editCond = fn => editDay(fn, { cond: true });

/* ---------- 근무조 · 지금 라운드 ----------
   주간 06:45 시작, 라운드 끝 08:50 · 11:00 · 13:40 · 15:30 / 야간 15:35 시작, 17:40 · 19:50 · 22:30 · 00:20.
   (야간 3R 끝 22:30은 추론: 저장된 20:30은 3R 시작으로 봄) 근무조는 기준 주에서 격주로 바뀐다. */
const SHIFT_T = { '주간': [405, 530, 660, 820, 930], '야간': [935, 1060, 1190, 1350, 1460] };
const weekStart = k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return keyOf(d); };
function shiftOf(k) {
  if (!base.shift || !/^\d{4}-\d{2}-\d{2}$/.test(String(base.shift.week || ''))) return '';
  const w = Math.round((parseKey(weekStart(k)) - parseKey(weekStart(base.shift.week))) / (7 * 864e5));
  return Math.abs(w) % 2 ? (base.shift.kind === '주간' ? '야간' : '주간') : base.shift.kind;
}
// 0 = 근무 전, 1~4 = 그 라운드 중(쉬는 시간이면 다음 라운드), 5 = 근무 끝
function curRound(k) {
  const now = new Date();
  let m = now.getHours() * 60 + now.getMinutes();
  if (keyOf(now) !== k) m += 1440; // 자정 넘긴 야간
  const kind = shiftOf(k) || (m >= 930 ? '야간' : '주간');
  const T = SHIFT_T[kind];
  if (m < T[0]) return 0;
  for (let r = 1; r <= 4; r++) if (m < T[r]) return r;

  const leaveRelief = c.leave.filter(id => P.get(id).role === '릴리프').length;
  const leaveNote = over
    ? `<p class="hint bad">연·월차가 ${LEAVE_MAX}명을 넘었어요. 릴리프 연·월차도 ${LEAVE_MAX}명 안에 들어가요.</p>`
    : leaveRelief ? `<p class="hint">릴리프 연·월차 ${leaveRelief}명도 ${LEAVE_MAX}명 안에 들어가요.</p>` : '';
  const notesCard = `
    <div class="card">
      <div class="card-h"><div class="hgrp"><h2>특이사항 <span class="count">${noteIds.length}건</span></h2><span class="quota${over ? ' over' : ''}">연·월차 <b>${leaveN}</b>/${LEAVE_MAX}</span></div><button class="btn primary sm" data-act="noteinput">+ 특이사항 넣기</button></div>
      ${noteIds.length ? `<div class="notes">${noteChips}</div>` : `<p class="noempty">없어요. 연차·조퇴·검진 등이 있으면 넣어 주세요.</p>`}
      ${leaveNote}
    </div>`;

  /* 업무표 */
  let pill;
  if (c.M === c.N) pill = '<span class="pill ok">딱 맞음</span>';
  else if (c.M > c.N) pill = `<span class="pill side">사이드 ${c.M - c.N}명</span>`;
  else pill = `<span class="pill bad">${c.N - c.M}명 부족</span>`;

  let tableHtml;
  if (!c.rows.length) {
    tableHtml = `<div class="tblempty">오늘 릴리프가 없어요. 아래 '+ 릴리프 추가'를 누르세요.</div>`;
  } else {
    const body = c.grid.map(g => {
      const p = g.row.p;
      const subs = [];
      if (g.cells) subs.push(`${g.n}번`);
      if (p.role !== '릴리프') subs.push(p.role);
      const head = `<th scope="row">${esc(p.name)}${subs.length ? `<small>${esc(subs.join(' · '))}</small>` : ''}</th>`;
      if (!g.cells) return `<tr class="offrow">${head}<td class="a offday" colspan="4">${esc(noteLabel(g.row.note))} · 오늘 빠짐</td></tr>`;
      const tds = g.cells.map((cell, ri) => {
        let cls, inner;
        if (cell.kind === 'keeper') { cls = 'k'; inner = '<span class="nm">키퍼</span>'; }
        else if (cell.kind === 'side') { cls = 'x'; inner = '<span class="nm">X</span>'; }
        else if (cell.kind === 'absent') { cls = 'a'; inner = `<span class="nm">${esc(cell.note.type)}</span>`; }
        else { cls = 'c'; inner = `<span class="nm">${esc(cell.slot.p.name)}</span><span class="st">${cell.slot.side} ${esc(cell.slot.seat.station)}</span><span class="st nt">${esc(cell.slot.note.type)}</span>`; }
        if (cell.moved) cls += ' mv';
        if (cell.lock) cls += ' lk';
        if (cell.fix) cls += ' fx';
        const r = ri + 1;
        const dnd = cell.kind === 'absent' ? '' : ` data-drag="duty" data-drop="duty" data-r="${r}" data-pid="${g.row.id}" data-label="${r}R ${esc(shortName(p.name))} · ${esc(cell.kind === 'cover' ? `${shortName(cell.slot.p.name)} 자리` : cellText(cell))}"`;
        if (ri === 0) return `<td class="${cls} first"${dnd}><button class="startbtn" data-act="start" data-v="${g.row.id}" aria-label="${esc(p.name)} 1R 시작 자리 바꾸기">${inner}</button></td>`;
        return `<td class="${cls}"${dnd}>${inner}</td>`;
      }).join('');
      return `<tr>${head}${tds}</tr>`;
    }).join('');
    tableHtml = `
      <div class="tbl-wrap">
        <table class="duty">
          <caption class="sr">${fmtDay(ui.date)} 릴리프 업무표</caption>
          <colgroup><col class="who"><col><col><col><col></colgroup>
          <thead><tr><th scope="col">릴리프</th>${ROUNDS.map(r => `<th scope="col">${r}R${c.planAt && r < c.planAt ? '<small>고정</small>' : ''}</th>`).join('')}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>`;
  }

  // 인원이 모자랄 때 먼저 넣을 사람
  const backupP = base.backup && P.has(base.backup) ? P.get(base.backup) : null;
  const listed = pendIdsFor(c.d);
  const bNote = backupP ? c.notes[backupP.id] : null;
  const backupBtn = backupP && !listed.includes(backupP.id) && !(bNote && ROUNDS.every(r => bNote.rounds.includes(r)))
    ? `<button class="btn sm ghost" data-act="addbackup">${esc(backupP.name)} 넣기</button>` : '';
  const offRelief = c.rows.filter(r => r.off && r.p.role === '릴리프');
  // 릴리프 인원을 바꿔 두면(적용 전) 적용 버튼이 켜진다
  const pd = pendDiff(c.d), pending = pd.add.length + pd.del.length > 0;
  const shortInfo = !pending && offRelief.length && c.M < reliefOrder().length ? `
      <div class="info"><p><b>${offRelief.map(r => `${esc(r.p.name)} ${esc(r.note.type)}`).join(', ')}</b> · 오늘 도는 사람이 ${c.M}명이에요. 대신 들어갈 사람을 넣어 주세요.</p>
        <div class="btns"><button class="btn sm" data-act="addrelief">+ 대신 넣기</button>${backupBtn}</div></div>` : '';

  const gapLines = c.gaps.map((miss, ri) => miss.length
    ? `<li><b>${ri + 1}R</b> ${miss.map(m => m.kind === 'keeper' ? '키퍼' : `${esc(m.p.name)} (${esc(seatText(m))})`).join(', ')}</li>` : '').join('');
  const warn = c.rows.length && gapLines ? `
    <div class="warn" role="alert"><strong>못 메운 자리가 있어요</strong><ul>${gapLines}</ul>
      <span class="hint">사람을 더 넣어 주세요.${backupP ? ` 인원이 모자라면 ${esc(eul(backupP.name))} 넣어요.` : ''}</span>
      <div class="btns">${backupBtn}<button class="btn sm ghost" data-act="addrelief">+ 릴리프 추가</button></div></div>` : '';

  const shareLabel = inFrame ? '사진 만들기' : '사진으로 보내기';
  const sendLabel = ui.date === today ? '오늘 표 보내기' : `${fmtShort(ui.date)} 표 보내기`;
  const lockBar = c.planAt ? `
      <div class="lockbar"><p><b>업무 중 바뀐 표</b> · ${c.planAt > 4 ? '근무가 끝나서 모든 라운드를 그대로 뒀어요.' : `${c.planAt > 1 ? `${c.planAt - 1}R까지는 그대로, ` : ''}${c.planAt}R부터 ${c.planFresh ? '바꾼 대로 ' : ''}다시 짰어요.`}${c.planFresh ? '' : ' 새 빈자리는 그 라운드 X 중 번호가 작은 사람이 메워요.'} 안 맞으면 칸을 길게 눌러 옮기세요.</p>
        <div class="btns"><button class="btn sm ghost" data-act="lockat" data-v="-1" ${c.planAt <= 1 ? 'disabled' : ''}>‹ 고정 줄이기</button><button class="btn sm ghost" data-act="lockat" data-v="1" ${c.planAt >= 5 ? 'disabled' : ''}>고정 늘리기 ›</button><button class="btn sm ghost" data-act="replan">처음부터 다시 짜기</button></div></div>` : '';
  const customized = Array.isArray(c.d.reliefs);
  const starterName = c.starter && c.starter.id ? nameOf(c.starter.id) : '';
  const startNote = (c.manual
    ? '1R 시작을 직접 바꿨어요. 2R부터는 한 칸씩 자동으로 돌아요.'
    : '1R 칸을 누르면 시작 자리를 직접 바꿀 수 있어요. 왜 이렇게 나왔는지는 아래 돌아가는 근거에 있어요.') + (c.ringSet ? ' 원 그림에서 칸 순서를 직접 바꿨어요.' : '');

  const noteLine = noteIds.length
    ? `<p class="notesline"><span>특이사항</span>${noteIds.map(id => `<b>${esc(nameOf(id))}</b> ${esc(noteLabel(c.notes[id]))}`).join(' · ')}</p>` : '';
  const seats = needSeats(c);
  const seatAlert = seats.length ? `
      <div class="info need-seat"><p><b class="bang">!</b> <b>채워야 할 자리 ${seats.length}곳</b> · ${seats.map(x => `${x.side} ${esc(x.seat.station)} (${x.owner ? `${esc(x.owner.name)} ` : ''}${esc(x.why)})`).join(', ')}</p>
        <div class="btns"><button class="btn sm" data-act="gotoseats">자리표에서 채우기</button></div></div>` : '';

  const dutyCard = `
    <div class="card">
      <div class="card-h"><h2>업무표 <span class="count">${fmtDay(ui.date)}</span></h2></div>
      <div class="need">${starterName ? `<span>키퍼 시작 <b class="kname">${esc(starterName)}</b></span>` : ''}<span>필요 <b>${c.N}</b>명 (키퍼 1 + 공백 ${c.N - 1})</span><span>릴리프 <b>${c.M}</b>명</span>${pill}</div>
      ${noteLine}
      ${shortInfo}
      ${lockBar}
      ${tableHtml}
      ${warn}
      ${seatAlert}
      <div class="legend"><span><i class="sw k"></i>키퍼</span><span><i class="sw c"></i>이름 = 그 사람 자리를 메움</span><span><i class="sw x"></i>X = 사이드(대기)</span><span><i class="sw a"></i>특이사항</span>${c.swapped ? '<span><i class="sw m"></i>직접 옮긴 칸</span>' : ''}${c.planAt ? '<span><i class="sw l"></i>지난 라운드(그대로)</span><span><i class="sw f"></i>업무 중 바뀐 칸</span>' : ''}</div>
      <p class="hint">칸을 길게 누르면 같은 라운드 안에서 다른 사람 칸과 맞바꿀 수 있어요. ${startNote}</p>
      <div class="btns">${c.swapped ? '<button class="btn ghost" data-act="swapreset">옮긴 칸 되돌리기</button>' : ''}${c.manual ? '<button class="btn ghost" data-act="autostart">규칙대로 되돌리기</button>' : ''}${c.ringSet ? '<button class="btn ghost" data-act="ringauto">원 순서 되돌리기</button>' : ''}<button class="btn primary" data-act="sendlink" ${c.rows.length ? '' : 'disabled'}>${sendLabel}</button><button class="btn ghost" data-act="share" ${c.rows.length ? '' : 'disabled'}>${shareLabel}</button><button class="btn ghost" data-act="sharetext" ${c.rows.length ? '' : 'disabled'}>글로 복사</button></div>
      <p class="hint"><b>${esc(sendLabel)}</b> = 단톡방에 올릴 링크를 만들어요. 링크를 누른 폰은 이 표와 명단·키퍼 순번·기록이 그대로 맞춰져요.</p>
    </div>`;

  /* 오늘 릴리프: 번호 순(0번 키퍼가 맨 위). 이름을 길게 눌러 키퍼 줄로 끌면 그 사람이 오늘 키퍼를 시작 */
  const noOf = row => (row.off || !c.numOf.has(row.id) ? 99 : c.numOf.get(row.id));
  const subsOf = (id, note) => {
    const p = P.get(id), s = SEAT.get(id), subs = [];
    if (p.role !== '릴리프') subs.push(p.role);
    if (s) subs.push(`원래 자리 ${s.side} ${s.seat.station}`);
    if (note) subs.push(noteLabel(note));
    return subs;
  };
  const reliefRows = c.rows.slice().sort((a, b) => (a.off - b.off) || (noOf(a) - noOf(b))).map(row => {
    const subs = subsOf(row.id, row.note);
    if (pd.del.includes(row.id)) {
      // 뺄 사람(적용 전): 줄 긋고 다시 넣기 버튼
      return `<li class="rrow gone"><span class="rnum">뺌<small>적용 전</small></span><button class="rname" data-act="relief" data-v="${row.id}"><b>${esc(row.p.name)}</b>${subs.length ? `<small>${esc(subs.join(' · '))}</small>` : ''}</button><button class="rx" data-act="rerelief" data-v="${row.id}" aria-label="${esc(row.p.name)} 다시 넣기">↺</button></li>`;
    }
    const n = noOf(row), zero = n === 0;
    const dnd = n === 99 ? '' : ` data-drag="rk" data-drop="rk" data-pid="${row.id}"${zero ? ' data-zero="1"' : ''} data-label="${esc(row.p.name)}"`;
    return `<li class="rrow${zero ? ' zero' : ''}${row.off ? ' off' : ''}"${dnd}><span class="rnum">${row.off ? '빠짐' : `${n}번${zero ? '<small>키퍼</small>' : ''}`}</span><button class="rname" data-act="relief" data-v="${row.id}"><b>${esc(row.p.name)}</b>${subs.length ? `<small>${esc(subs.join(' · '))}</small>` : ''}</button><button class="rx" data-act="unrelief" data-v="${row.id}" aria-label="${esc(row.p.name)} 오늘 릴리프에서 빼기">✕</button></li>`;
  }).join('') + base.people.filter(p => pd.add.includes(p.id)).map(p => {
    // 넣을 사람(적용 전)
    const subs = subsOf(p.id, c.notes[p.id]);
    return `<li class="rrow new"><span class="rnum">새로<small>적용 전</small></span><button class="rname" data-act="relief" data-v="${p.id}"><b>${esc(p.name)}</b>${subs.length ? `<small>${esc(subs.join(' · '))}</small>` : ''}</button><button class="rx" data-act="unrelief" data-v="${p.id}" aria-label="${esc(p.name)} 넣기 취소">✕</button></li>`;
  }).join('');
  const reliefCard = `
    <div class="card">
      <div class="card-h"><h2>오늘 릴리프 <span class="count">${pending ? `${pd.now.length}명 → ${pd.next.length}명` : `${c.rows.length}명`}</span></h2></div>
      ${reliefRows ? `<ul class="rlist">${reliefRows}</ul>` : ''}
      <p class="hint">이름을 길게 눌러 맨 위 <b>키퍼</b> 줄로 끌면 그 사람이 오늘 키퍼를 시작하고, 번호는 출근부 순서대로 다시 붙어요. 다음 근무일부터는 그 사람 다음 차례로 이어져요. 이름을 누르면 다른 사람으로 바꿔요. 넣거나 빼면 '적용 전'으로 모아 두고, 화면 아래에 뜨는 <b>적용</b>을 누르면 업무표·번호·키퍼 순번에 모두 들어가요. 공백이 많으면 파트장·그룹장·작업자를 더 넣을 수 있어요.${backupP ? ` 인원이 모자라면 ${esc(eul(backupP.name))} 먼저 넣어요.` : ''} 작업자를 넣으면 그 사람 자리는 오늘 공석(!)이 되고, 빼면 제자리로 돌아가요.</p>
      <div class="btns"><button class="btn" data-act="addrelief">+ 릴리프 추가</button>${backupBtn}${c.turn && c.turn.set ? '<button class="btn ghost" data-act="turnauto">키퍼 순번대로</button>' : ''}${customized ? '<button class="btn ghost" data-act="defrelief">기본 릴리프로</button>' : ''}</div>
    </div>`;

  // (v7) 순서: 특이사항 → 오늘 릴리프 → 업무표 → 라운드마다 한 칸씩(배치 안 + 원 그림) → 돌아가는 근거(①②③)
  el.innerHTML = dateBar + notesCard + reliefCard + dutyCard + ringCard(c, prev) + whyCard(c);
  mountRing(lastC); // 미리보기 중이면 그 안으로 이름표를 놓는다
}

/* ---------- 돌아가는 근거 ---------- */
function reasonOf(c, g) {
  if (g.cells[0] && g.cells[0].fix) return '업무 중 바뀜';
  if (g.cells[0] && g.cells[0].moved) return '1R 직접 옮김';
  if (c.manual) return '직접 정함';
  if (g.n === 0) return c.starter.sub && c.turn ? `${shortName(nameOf(c.turn.owner))} 차례 대신` : c.turn && c.turn.set ? '직접 키퍼로 정함' : '오늘 키퍼 순번';
  if (c.vacRank.has(g.row.id)) return `빈자리 ${c.vacRank.get(g.row.id)}순위`;
  const i = g.cells.findIndex(x => x.kind === 'keeper' || x.kind === 'cover');
  if (i < 0) return '오늘 종일 X';
  const what = g.cells[i].kind === 'keeper' ? '키퍼' : `${shortName(g.cells[i].slot.p.name)} 자리`;
  return i === 0 ? `${what}부터` : `${i}R 쉬고 ${i + 1}R ${what}`;
}

function whyCard(c) {
  if (!c.rows.length) return '';
  const t = c.turn;
  let s1;
  if (!t) {
    s1 = '<p class="hint">릴리프 역할인 사람이 없어서 순번이 없어요. 오늘 도는 사람 중 출근부 맨 위 사람이 키퍼를 시작해요.</p>';
  } else {
    // 맨 앞이 오늘 차례가 되게 돌려서 보여 준다. 그날 들어온 사람도 출근부 자리대로 줄에 낀다
    const chips = t.order.map((_, j) => (t.idx + j) % t.order.length).map(i => {
      const id = t.order[i];
      const own = i === t.idx, go = id === c.starter.id, add = t.added(id);
      const n = c.notes[id];
      const out = !c.group.includes(id) || (n && n.rounds.includes(1));
      const subs = [];
      if (go) subs.push(c.starter.sub ? '대신 시작' : '키퍼 시작');
      else if (own) subs.push(n ? n.type : c.group.includes(id) ? '오늘 차례' : '오늘 없음');
      if (add) subs.push('들어옴');
      return `<span class="tchip${own ? ' own' : ''}${go ? ' go' : ''}${out ? ' out' : ''}${add ? ' add' : ''}" data-drag="tc" data-drop="tc" data-pid="${id}"${own ? ' data-own="1"' : ''} data-label="${esc(nameOf(id))}"><b>${esc(nameOf(id))}</b>${subs.length ? `<small>${esc(subs.join(' · '))}</small>` : ''}</span>`;
    }).join('<span class="tarr" aria-hidden="true">›</span>');
    const owner = nameOf(t.owner), nxt = nameOf(t.next), prv = nameOf(t.prev);
    const how = t.added(t.owner) ? '(오늘 들어옴)' : '';
    let line;
    if (t.noAnchor) line = '키퍼 순번을 아직 맞추지 않았어요. 아래 버튼으로 오늘 차례인 사람을 맞춰 주세요.';
    else if (t.set) line = `오늘은 <b>${esc(owner)}</b>${how} 차례로 직접 정했어요${t.auto ? `(순번대로면 ${esc(nameOf(t.auto))})` : ''}.`;
    else if (!t.work) line = `오늘은 <b>${esc(owner)}</b> 차례예요.`;
    else line = `지난 근무일(${fmtShort(t.prevK)})은 <b>${esc(prv)}</b>, 오늘은 출근부에서 바로 아래 <b>${esc(owner)}</b>${how} 차례예요.`;
    if (c.starter.sub) line += ` ${esc(ga(owner))} 빠져서 앞 순번 <b>${esc(ga(nameOf(c.starter.id)))}</b> 대신 시작해요. 순번은 ${esc(owner)} 몫으로 쳐요.`;
    if (!t.noAnchor) line += ` 다음 근무일(${fmtShort(t.nextK)})은 <b>${esc(nxt)}</b> 차례예요.`;
    const wm = workMark(c.k);
    if (!t.work) line += ` ${wm === 'off' ? '휴무로 정한 날이라' : '주말이라'} 순번을 넘기지 않았어요.${wm ? '' : " 특근이면 아래 '이 날 특근'을 눌러 주세요."}`;
    else if (wm === 'on') line += ' 특근이라 순번을 이어 갔어요.';
    s1 = `
          <div class="turnrow" aria-label="키퍼 순번">${chips}</div>
          <p class="hint">${line}</p>
          <div class="btns"><button class="btn sm ghost" data-act="turn" data-v="-1">‹ 앞 순번으로</button><button class="btn sm ghost" data-act="turn" data-v="1">다음 순번으로 ›</button>${t.set ? '<button class="btn sm ghost" data-act="turnauto">자동 순번으로</button>' : ''}${!t.work && !workMark(c.k) ? '<button class="btn sm" data-act="workset" data-v="on">이 날 특근</button>' : ''}</div>
          <p class="hint">맨 앞이 오늘 차례예요. 근무일마다 지난 차례 바로 아래 사람(출근부 순서)으로 넘어가고, 그날 들어온 사람도 출근부 자리대로 줄에 껴요. 이름을 길게 눌러 맨 앞으로 끌면(또는 맨 앞을 다른 이름에 놓으면) 그 사람이 오늘 차례가 되고, 다음 근무일부터 그 사람 다음으로 이어져요. 특근·휴무는 달력에서 정해요.</p>`;
  }
  if (!c.group.length) {
    return `
    <div class="card" id="whyCard">
      <div class="card-h"><h2>돌아가는 근거</h2></div>
      <ol class="steps"><li class="step"><div class="sh"><span class="sn">1</span><b>키퍼 순번</b><small>근무일마다 한 칸씩 아래로</small></div>${s1}</li></ol>
      <p class="hint">오늘 도는 사람이 없어요. '+ 릴리프 추가'로 넣어 주세요.</p>
    </div>`;
  }

  const s2 = `
          <ol class="numcol" aria-label="출근부 순서와 오늘 번호">${c.group.map(id => {
            const p = P.get(id), n = c.numOf.get(id);
            const tag = n === 0 ? '키퍼 시작' : p.role !== '릴리프' ? p.role : '';
            return `<li class="${n === 0 ? 'zero' : ''}"><span class="nb">${n}</span><b>${esc(p.name)}</b>${tag ? `<small>${esc(tag)}</small>` : '<span></span>'}</li>`;
          }).join('')}</ol>
          <p class="hint">오늘 도는 사람을 출근부 순서로 놓고, 키퍼 시작(0번)에서 위로 1·2·3… 맨 위 다음은 맨 아래로 이어져요. 대신 들어온 사람도 출근부 자리대로 번호를 받아요.</p>`;

  const byNum = c.nums.map(id => c.grid.find(g => g.row.id === id)).filter(g => g && g.cells);
  const s3rows = byNum.map(g => {
    const cell = g.cells[0];
    const cls = cell.kind === 'keeper' ? 'k' : cell.kind === 'cover' ? 'c' : cell.kind === 'absent' ? 'a' : 'x';
    const txt = cell.kind === 'keeper' ? '키퍼' : cell.kind === 'cover' ? `${shortName(cell.slot.p.name)} 자리` : cell.kind === 'absent' ? cell.note.type : 'X';
    return `<tr><td><span class="nb">${g.n}</span></td><td class="nm">${esc(g.row.p.name)}</td><td class="${cls}">${esc(txt)}</td><td class="why">${esc(reasonOf(c, g))}</td><td class="xn">${c.xCount.get(g.row.id)}</td></tr>`;
  }).join('');
  const s3 = `
          <div class="why-wrap"><table class="why-t"><thead><tr><th scope="col">번호</th><th scope="col">이름</th><th scope="col">1R</th><th scope="col">이유</th><th scope="col" class="xn">X</th></tr></thead><tbody>${s3rows}</tbody></table></div>
          <p class="hint">0번은 키퍼, 1번부터 빈자리에 들어가요. 빈자리는 빠진 사람 연차순(출근부 위쪽부터)이에요. 남은 번호는 X로 시작하고, 번호가 클수록 X(사이드)를 같거나 더 많이 받아요. X 칸은 하루 동안 쉬는 횟수예요.</p>
          ${c.planAt ? '<p class="hint bad">업무 중에 바뀐 날이에요. 번호와 원 그림은 규칙 기준이고, 표는 바뀐 대로예요.</p>' : ''}
          ${c.manual || c.swapped ? '<p class="hint bad">직접 바꾼 칸이 있어서 이 규칙과 다른 곳이 있어요. 원 그림은 실제 표대로 보여 줘요.</p>' : c.ringSet ? '<p class="hint">원 그림에서 칸 순서를 직접 바꿨어요. 1R 자리는 이 규칙 그대로고, 2R부터 바꾼 순서대로 돌아요.</p>' : c.rating && c.rating.inv ? '<p class="hint">이 날은 빈자리가 비는 시간 때문에 X가 번호 순서대로 다 나뉘지는 않았어요.</p>' : ''}`;

  return `
    <div class="card" id="whyCard">
      <div class="card-h"><h2>돌아가는 근거</h2></div>
      <ol class="steps">
        <li class="step"><div class="sh"><span class="sn">1</span><b>키퍼 순번</b><small>근무일마다 한 칸씩 아래로</small></div>${s1}</li>
        <li class="step"><div class="sh"><span class="sn">2</span><b>오늘 번호</b><small>키퍼 시작 0번, 출근부에서 위로</small></div>${s2}</li>
        <li class="step"><div class="sh"><span class="sn">3</span><b>1R 자리</b><small>0번 키퍼, 1번부터 빈자리</small></div>${s3}</li>
      </ol>
      <p class="hint">④ 라운드마다 한 칸씩(배치 안·원 그림)은 업무표 바로 아래에 있어요.</p>
    </div>`;
}

/* ---------- (v7) 라운드마다 한 칸씩: 배치 안 + 원 그림 (업무표 바로 아래) ---------- */
function ringCard(c, prev) {
  if (!c.rows.length || !c.group.length) return '';
  // 배치 안: 누르면 아래 원에 미리 보이고, 화면 아래 '적용'을 누르면 업무표에 들어간다
  const pk = pickFor(c.k), shown = pk ? pk.opt : c.optCur;
  const optCards = c.opts.map((o, i) => {
    const cur = o.id === c.optCur, on = o.id === shown;
    return `<button class="optc${cur ? ' cur' : ''}${on ? ' on' : ''}" data-act="optpick" data-v="${o.id}" role="radio" aria-checked="${on}"><span class="oh"><b>안 ${i + 1} · ${esc(optTitle(c, o))}</b>${cur ? '<i class="otag">지금</i>' : ''}${pk && pk.opt === o.id ? '<i class="otag pk">고름 · 적용 전</i>' : ''}</span><span class="od">${esc(optDesc(c, o))}</span><span class="or">${esc(o.ring.join(' → '))}</span><span class="ox">X ${esc(o.x.map(([pid, x]) => `${shortName(nameOf(pid))}${x}`).join(' · '))}</span></button>`;
  }).join('');
  const optNote = c.E === 0 ? '오늘은 X 칸이 없어서 자리 순서대로 돌아요.'
    : !c.optCur ? '원 그림에서 직접 바꾼 배치를 쓰는 중이에요. 안을 골라 적용하면 직접 바꾼 건 지워져요.'
    : '안을 누르면 아래 원에 미리 보여요. 화면 아래 <b>적용</b>을 눌러야 업무표에 들어가요. 적용한 뒤에도 칸·이름표를 길게 눌러 바꿀 수 있어요.';
  const rc = prev || c;
  const s4 = `
          <div class="opts" role="radiogroup" aria-label="배치 안">${optCards}</div>
          <p class="hint">${optNote}</p>
          ${prev ? `<p class="pvtag">미리보기 · 안 ${c.opts.findIndex(o => o.id === pk.opt) + 1} ${esc(pk.title)} — 아직 업무표에는 안 들어갔어요</p>` : ''}
          <div class="ringbox${prev ? ' pv' : ''}" id="ringBox">${ringSvg(rc)}</div>
          <div class="ringctl"><div class="seg" role="group" aria-label="라운드 고르기">${ROUNDS.map(r => `<button data-act="ringr" data-v="${r}" aria-pressed="${ui.ringR === r}">${r}R</button>`).join('')}</div><button class="btn sm" data-act="ringplay" id="ringPlay" aria-pressed="false">▶ 돌려 보기</button></div>
          <p class="ringcap" id="ringCap" aria-live="polite"></p>
          <div class="legend"><span><i class="sw k"></i>키퍼</span><span><i class="sw c"></i>빈자리 메움</span><span><i class="sw x"></i>X</span><span><i class="sw d"></i>그 라운드엔 아직 안 빈 자리</span></div>
          <p class="hint">안쪽 칸이 일, 바깥 이름표가 사람이에요. 라운드마다 모두 화살표 방향으로 한 칸씩 옮겨요. 숫자는 오늘 번호예요.</p>
          ${prev ? '<p class="hint">미리보기 중에는 원 그림을 끌 수 없어요. 적용한 뒤에 끌어서 바꾸세요.</p>' : c.planAt ? '<p class="hint">업무 중에 바뀐 날은 원 그림을 끌 수 없어요. 위 업무표에서 칸을 길게 눌러 옮기세요.</p>' : '<p class="hint">길게 눌러 끌어서 바꿀 수 있어요. <b>안쪽 칸</b>을 다른 칸에 놓으면 두 칸 자리가 바뀌어요(1R 일은 그대로, 2R부터 도는 순서가 바뀜). <b>이름표</b>를 다른 이름표에 놓으면 두 사람 자리가 바뀌고, 0번(키퍼)에 놓으면 그 사람이 키퍼 시작이에요. 바꾸면 업무표·자리표에 바로 들어가요.</p>'}
          ${c.ringSet || c.manual ? `<div class="btns">${c.ringSet ? '<button class="btn sm ghost" data-act="ringauto">원 순서 되돌리기</button>' : ''}${c.manual ? '<button class="btn sm ghost" data-act="autostart">사람 자리 규칙대로</button>' : ''}</div>` : ''}`;

  return `
    <div class="card" id="ringCard">
      <div class="card-h"><h2>라운드마다 한 칸씩</h2><small class="hsub">${c.ringSet ? '직접 바꾼 칸 순서' : '배치 안 고르기 · 키퍼 앞뒤 X, 1번 맞은편'}</small></div>
      ${s4}
    </div>`;
}

/* ---------- 원 그림 ---------- */
const RG = { W: 340, H: 316, cx: 170, cy: 158, Rs: 80, Rp: 128 };
const ringDeg = (i, L) => 90 - (i * 360) / L;
const ringXY = (R, deg) => { const a = (deg * Math.PI) / 180; return [RG.cx + R * Math.cos(a), RG.cy + R * Math.sin(a)]; };
const f1 = v => (Math.round(v * 10) / 10).toString();
function slotLabel(sl, L) {
  if (sl.kind === 'keeper') return '키퍼';
  if (sl.kind === 'side') return 'X';
  const nm = shortName(sl.p.name);
  return L >= 7 ? nm : `${nm} 자리`;
}
function ringSvg(c) {
  const L = c.L, canDrag = !c.planAt && !c.preview;
  const out = [`<svg class="ring" viewBox="0 0 ${RG.W} ${RG.H}" role="img" aria-labelledby="ringCap">`];
  out.push(`<circle class="track" cx="${RG.cx}" cy="${RG.cy}" r="${RG.Rs}"/>`);
  if (L > 1) for (let i = 0; i < L; i++) {
    const a = ringDeg(i, L) - 180 / L;
    const [x, y] = ringXY(RG.Rs, a);
    out.push(`<path class="chev" d="M-3.5 -5 L2.5 0 L-3.5 5" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(a - 90)})"/>`);
  }
  c.ring.forEach((sl, i) => {
    const [x, y] = ringXY(RG.Rs, ringDeg(i, L));
    const label = slotLabel(sl, L);
    const w = sl.kind === 'side' ? 30 : Math.round(label.replace(/\s/g, '').length * 11.5 + (label.includes(' ') ? 4 : 0) + 14);
    const cls = sl.kind === 'keeper' ? 'k' : sl.kind === 'side' ? 'x' : 'v';
    const dnd = canDrag ? ` data-drag="rcell" data-drop="rcell"${sl.kind === 'side' ? ' data-x="1"' : ''} data-label="${esc(sl.kind === 'seat' ? `${shortName(sl.p.name)} 자리` : label)}"` : '';
    out.push(`<g class="rs ${cls}" data-i="${i}"${dnd} transform="translate(${f1(x)} ${f1(y)})"><rect x="${-w / 2}" y="-12" width="${w}" height="24" rx="5"/><text y="4.2">${esc(label)}</text></g>`);
  });
  out.push(`<text class="rc-r" id="ringRound" x="${RG.cx}" y="${RG.cy + 9}">${ui.ringR}R</text>`);
  for (const id of c.group) {
    if (c.starts[id] === undefined) continue;
    const n = c.numOf.get(id);
    const dnd = canDrag ? ` data-drag="rtag" data-drop="rtag" data-pid="${id}"${n === 0 ? ' data-zero="1"' : ''} data-label="${n} ${esc(shortName(nameOf(id)))}"` : '';
    out.push(`<g class="rp x" data-id="${id}"${dnd}><rect x="-28" y="-12.5" width="56" height="25" rx="12.5"/><circle cx="-15.5" cy="0" r="8.5"/><text class="rp-n" x="-15.5" y="3.7">${n}</text><text class="rp-t" x="7.5" y="4.6">${esc(shortName(nameOf(id)))}</text></g>`);
  }
  out.push('</svg>');
  return out.join('');
}
function ringCaption(c, r) {
  const k = [], v = [], x = [], a = [];
  for (const g of c.grid) {
    if (!g.cells) continue;
    const cell = g.cells[r - 1], nm = shortName(g.row.p.name);
    if (cell.kind === 'keeper') k.push(nm);
    else if (cell.kind === 'cover') v.push(`${shortName(cell.slot.p.name)} 자리 ${nm}`);
    else if (cell.kind === 'absent') a.push(nm);
    else x.push(nm);
  }
  const parts = [];
  if (k.length) parts.push(`키퍼 ${k.join(', ')}`);
  parts.push(...v);
  if (x.length) parts.push(`X ${x.join(', ')}`);
  if (a.length) parts.push(`빠짐 ${a.join(', ')}`);
  return `${r}R · ${parts.join(' · ')}`;
}
function ringState(c, r, svg) {
  svg.querySelectorAll('.rs').forEach(el => {
    const sl = c.ring[+el.dataset.i];
    el.classList.toggle('off', !!sl && sl.kind === 'seat' && !sl.rounds.includes(r));
  });
  svg.querySelectorAll('.rp').forEach(el => {
    const g = c.grid.find(x => x.row.id === el.dataset.id);
    const cell = g && g.cells ? g.cells[r - 1] : null;
    const cls = !cell ? 'x' : cell.kind === 'keeper' ? 'k' : cell.kind === 'cover' ? 'v' : cell.kind === 'absent' ? 'a' : 'x';
    el.setAttribute('class', 'rp ' + cls);
  });
  const rr = svg.querySelector('#ringRound');
  if (rr) rr.textContent = `${r}R`;
  const cap = document.getElementById('ringCap');
  if (cap) cap.textContent = ringCaption(c, r);
  document.querySelectorAll('[data-act="ringr"]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === r)));
}
let ringAnim = 0;
function ringPos(c, id, r) {
  const g = c.grid.find(x => x.row.id === id);
  const cell = g && g.cells ? g.cells[r - 1] : null;
  if (cell && cell.idx >= 0) return cell.idx;
  return (((c.starts[id] + r - 1) % c.L) + c.L) % c.L;
}
function placeRing(c, fromR, toR, animate) {
  const svg = document.querySelector('#ringBox svg');
  if (!svg) return;
  const L = c.L, unit = 360 / L;
  const people = [...svg.querySelectorAll('.rp')];
  const ang = id => {
    const p0 = ringPos(c, id, fromR), p1 = ringPos(c, id, toR), a0 = ringDeg(p0, L);
    if (toR >= fromR) return [a0, a0 - ((((p1 - p0) % L) + L) % L) * unit];
    return [a0, a0 + ((((p0 - p1) % L) + L) % L) * unit];
  };
  const paint = t => {
    for (const el of people) {
      const id = el.dataset.id;
      const [a0, a1] = ang(id);
      const [x, y] = ringXY(RG.Rp, a0 + (a1 - a0) * t);
      el.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
    }
  };
  cancelAnimationFrame(ringAnim);
  ringState(c, toR, svg);
  let reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (!animate || reduce || fromR === toR) { paint(1); return; }
  const t0 = performance.now(), dur = 460 * Math.min(3, Math.abs(toR - fromR));
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    paint(t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    if (t < 1) ringAnim = requestAnimationFrame(step);
  };
  paint(0);
  ringAnim = requestAnimationFrame(step);
}
function mountRing(c) {
  if (!document.querySelector('#ringBox svg')) return;
  placeRing(c, ui.ringR, ui.ringR, false);
}
let ringTimer = null;
function stopRingPlay() {
  if (ringTimer) clearInterval(ringTimer);
  ringTimer = null;
  const b = document.getElementById('ringPlay');
  if (b) { b.textContent = '▶ 돌려 보기'; b.setAttribute('aria-pressed', 'false'); }
}
function toggleRingPlay() {
  if (ringTimer) { stopRingPlay(); return; }
  if (!lastC) return;
  const b = document.getElementById('ringPlay');
  if (b) { b.textContent = '■ 멈추기'; b.setAttribute('aria-pressed', 'true'); }
  if (ui.ringR !== 1) { const from = ui.ringR; ui.ringR = 1; placeRing(lastC, from, 1, false); }
  ringTimer = setInterval(() => {
    if (!lastC || ui.ringR >= ROUNDS.length) { stopRingPlay(); return; }
    const from = ui.ringR;
    ui.ringR += 1;
    placeRing(lastC, from, ui.ringR, true);
  }, 1200);
}

/* ---------- 순번 고치기 · 모자랄 때 넣기 ---------- */
// 그날 차례 정하기(끌기·‹ › 버튼 모두): 그 사람이 오늘 차례 → 번호 다시, 다음 근무일부터 그 사람 다음으로 이어진다.
// pid가 순번대로 차례인 사람이거나 없으면 직접 정한 걸 지운다. 사람 자리·칸 바꾼 것(starts·swaps)은 번호가 바뀌므로 지운다.
function setOwner(pid, msg) {
  const t = turnFor(ui.date);
  const before = snapDay();
  editDay(d => {
    if (pid && !(t && t.auto === pid)) d.turn = pid; else delete d.turn;
    delete d.starts; delete d.swaps;
  });
  render();
  const t2 = turnFor(ui.date);
  toast(`${msg}${t2 && t2.next ? ` · 다음 근무일 ${nameOf(t2.next)}` : ''}`, () => restoreDay(before));
}
function shiftTurn(delta) {
  const t = turnFor(ui.date);
  if (!t) return;
  const n = t.order.length, idx = (((t.idx + delta) % n) + n) % n;
  setOwner(t.order[idx], `${fmtDay(ui.date)} 키퍼 순번: ${nameOf(t.order[idx])} 차례`);
}
// 특근(on)·휴무(off) 표시: 같은 걸 한 번 더 누르면 뺀다
function setWork(v) {
  const before = snapDay();
  const cur = workMark(ui.date);
  editDay(d => { if (cur === v) delete d.work; else d.work = v; });
  render();
  const now = workMark(ui.date);
  toast(now ? `${fmtDay(ui.date)} ${now === 'on' ? '특근 · 키퍼 순번이 이어져요' : '휴무 · 키퍼 순번을 건너뛰어요'}` : `${fmtDay(ui.date)} 특근·휴무 표시를 뺐어요`, () => restoreDay(before));
}
function addBackup() {
  if (!base.backup || !P.has(base.backup)) return;
  const id = base.backup;
  stageRoster(arr => { if (!arr.includes(id)) arr.push(id); return arr; }, `${nameOf(id)} 넣음`);
}
// 오늘 릴리프 넣기·빼기·바꾸기는 '적용 전'(days[날짜].pend)으로 모은다. 적용을 눌러야 표에 들어간다
function stageRoster(fn, msg) {
  const before = snapDay();
  editDay(d => { const arr = pendIdsFor(d).slice(); d.pend = fn(arr) || arr; });
  render();
  const d = days[ui.date];
  toast(`${msg}${d && Array.isArray(d.pend) ? " · '적용'을 누르면 표에 들어가요" : ' · 바꾼 게 없어졌어요'}`, () => restoreDay(before));
}
/* ---------- 배치 안 ---------- */
// 안 이름: 규칙대로 / 2번이 2R 키퍼 / 반대쪽(규칙은 같고 남는 X를 다른 쪽에) · 다른 배치 / 예전 방식
function optTitle(c, o) {
  if (o.id === 'rule') return '규칙대로';
  if (o.id === 'two') return '2번이 2R 키퍼';
  if (o.id === 'old') return '예전 방식(X 고르게)';
  const r0 = (c.opts.find(x => x.id === 'rule') || {}).r;
  const same = x => r0 && x.r.kx === r0.kx && x.r.opp === r0.opp;
  if (o.id === 'side') return same(o) ? '반대쪽' : '다른 배치';
  const s = c.opts.find(x => x.id === 'side');
  return same(o) ? (s && same(s) ? '반대쪽 2' : '반대쪽') : (s && !same(s) ? '다른 배치 2' : '다른 배치');
}
function optDesc(c, o) {
  const t = [];
  if (c.E >= 2) t.push(o.r.xb && o.r.xa ? '키퍼 앞뒤 X' : !o.r.xb && !o.r.xa ? '키퍼 앞뒤 X 없음' : o.r.xb ? '키퍼 뒤 X 없음' : '키퍼 앞 X 없음');
  else if (c.E === 1) t.push(o.r.xb ? '키퍼 앞 X' : '키퍼 앞 X 없음');
  if (o.oneVac) t.push(o.r.opp <= c.L % 2 ? '1번 맞은편' : '1번 맞은편 아님');
  if (o.k2) t.push(`2R 키퍼 ${shortName(nameOf(o.k2))}`);
  if (o.id === 'old') t.push('번호 순서대로 X 고르게');
  return t.join(' · ');
}
// 골라 둔 배치 안(적용 전) — 그 날짜에만
const pickFor = k => (ui.pick && ui.pick.k === k ? ui.pick : null);
function pickOpt(id) {
  const c = compute();
  const o = c.opts.find(x => x.id === id);
  if (!o) return;
  ui.pick = id === c.optCur ? null : { k: ui.date, opt: id, title: optTitle(c, o) };
  render();
}

/* ---------- 화면 아래 고정 '적용' ----------
   릴리프 인원을 바꿨거나 배치 안을 골라 두면 뜨고, 스크롤을 따라다니고, 적용하거나 취소하면 사라진다 */
function renderFloat() {
  const box = $('#applyFloat');
  const d = days[ui.date];
  const pd = pendDiff(d), roster = pd.add.length + pd.del.length > 0, pk = pickFor(ui.date);
  const html = document.documentElement;
  if (!base.people.length || (!roster && !pk)) {
    box.innerHTML = ''; html.classList.remove('has-float'); html.style.removeProperty('--floatH');
    return;
  }
  const mid = midRound(ui.date);
  const parts = [];
  if (roster) parts.push(`릴리프 ${pd.now.length}명 → ${pd.next.length}명(${[pd.add.length ? `넣음 ${pd.add.map(nameOf).join(', ')}` : '', pd.del.length ? `뺌 ${pd.del.map(nameOf).join(', ')}` : ''].filter(Boolean).join(' · ')})`);
  if (pk) parts.push(`배치 '${pk.title}'`);
  const btns = mid
    ? `<button class="btn lit" data-act="applyroster" data-v="now">적용 · ${mid}R부터</button><button class="btn ghost" data-act="applyroster" data-v="all">처음부터 적용</button>`
    : '<button class="btn lit" data-act="applyroster" data-v="all">적용</button>';
  box.innerHTML = `<div class="applybar" role="status"><p><b>적용 전</b> · ${esc(fmtShort(ui.date))} ${esc(parts.join(' · '))}${mid ? ` · 지금 ${mid}R이라 ${mid - 1}R까지는 그대로 둘 수 있어요` : ''}</p><div class="btns">${btns}<button class="btn ghost" data-act="pendcancel">취소</button></div></div>`;
  html.classList.add('has-float');
  html.style.setProperty('--floatH', `${box.firstElementChild.offsetHeight + 12}px`);
}
// 적용 전인 것(릴리프 인원·배치 안)을 적용: 업무표·번호·키퍼 순번·원 그림을 다시 짠다.
// fromNow = 업무 중이면 지난 라운드는 그대로 두고 지금 라운드부터 새로(plan.fresh)
function applyRoster(fromNow) {
  const k = ui.date, d0 = days[k] || { notes: {} };
  const roster = Array.isArray(d0.pend), pk = pickFor(k);
  if (!roster && !pk) return;
  const before = snapDay(), o0 = turnFor(k);
  const { del, next } = pendDiff(d0);
  const r0 = fromNow ? midRound(k) : 0;
  let cells = null;
  if (r0) {
    const c0 = compute(k);
    cells = {};
    for (const g of c0.grid) if (g.cells) cells[g.row.id] = g.cells.map(cellRef);
  }
  editDay(d => {
    if (roster) {
      d.reliefs = next.slice();
      delete d.pend;
      for (const id of del) {
        const p = P.get(id), st = SEAT.get(id);
        if (d.turn === id && p && p.role !== '릴리프') delete d.turn;
        if (st && d.fills && d.fills[st.seat.id]) delete d.fills[st.seat.id]; // 제자리로 돌아오면 대신 서던 사람은 빠진다
      }
    }
    if (pk) { if (pk.opt === 'rule') delete d.opt; else d.opt = pk.opt; delete d.ring; }
    delete d.starts; delete d.swaps;
    if (r0) d.plan = { at: r0, cells, fresh: true }; else delete d.plan;
  });
  ui.pick = null;
  render();
  const what = [roster ? `릴리프 ${next.length}명` : '', pk ? `배치 '${pk.title}'` : ''].filter(Boolean).join(' · ');
  toast(`${what} 적용했어요${r0 ? ` · ${r0}R부터 새로` : ''}${keeperNews(o0)}`, () => restoreDay(before));
}

function renderCal() {
  const el = $('#view-cal');
  const ym = ui.calMonth || ui.date.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const startDow = new Date(y, m - 1, 1, 12).getDay(), nDays = new Date(y, m, 0).getDate();
  const today = workDayKey(), cutoff = addDays(today, -KEEP_DAYS);
  const cells = DOW.map((w, i) => `<span class="cw${i === 0 || i === 6 ? ' we' : ''}">${w}</span>`);
  for (let i = 0; i < startDow; i++) cells.push('<span class="cd blank" aria-hidden="true"></span>');
  const month = new Map();
  for (let dd = 1; dd <= nDays; dd++) {
    const k = `${y}-${pad2(m)}-${pad2(dd)}`;
    const notes = (days[k] && days[k].notes) || {};
    let lv = 0, ot = 0;
    for (const [pid, n] of Object.entries(notes)) {
      if (!P.has(pid) || !n || !TYPE_DEF[n.type]) continue;
      if (LEAVE_TYPES.includes(n.type)) { lv++; month.set(pid, (month.get(pid) || 0) + 1); } else ot++;
    }
    const dow = parseKey(k).getDay(), wm = workMark(k);
    const cls = ['cd', dow === 0 || dow === 6 ? 'we' : '', k === today ? 'today' : '', k === ui.date ? 'sel' : '', k < cutoff ? 'old' : '', lv > LEAVE_MAX ? 'over' : lv === LEAVE_MAX ? 'full' : '', wm === 'on' ? 'ex' : wm === 'off' ? 'ho' : ''].filter(Boolean).join(' ');
    cells.push(`<button class="${cls}" data-act="calday" data-v="${k}" aria-pressed="${k === ui.date}" aria-label="${fmtDay(k)}${wm ? (wm === 'on' ? ' 특근' : ' 휴무') : ''} 연·월차 ${lv}명${ot ? `, 다른 특이사항 ${ot}건` : ''}"><span class="ct"><span class="dn2">${dd}</span>${wm ? `<i class="wtag ${wm}">${wm === 'on' ? '특근' : '휴무'}</i>` : ''}</span><span class="cm">${lv ? `<b class="lv">${lv}</b>` : ''}${ot ? `<i class="ot">+${ot}</i>` : ''}</span></button>`);
  }
  const k = ui.date, c = compute(k);
  const ids = base.people.filter(p => c.notes[p.id]).map(p => p.id);
  const lvN = c.leave.length, over = lvN > LEAVE_MAX;
  const list = ids.length
    ? `<div class="notes">${ids.map(id => `<span class="nchip"><button class="ne" data-act="noteedit" data-v="${id}"><b>${esc(nameOf(id))}</b>${esc(noteLabel(c.notes[id]))}</button></span>`).join('')}</div>`
    : '<p class="noempty">특이사항이 없어요.</p>';
  const t = c.turn;
  const order = new Map(base.people.map((p, i) => [p.id, i]));
  const sum = [...month.entries()].sort((a, b) => (b[1] - a[1]) || (order.get(a[0]) - order.get(b[0])));
  const wmk = workMark(k);
  const workHint = wmk === 'on' ? '특근이에요. 이 날도 근무일로 쳐서 키퍼 순번이 이어져요. 한 번 더 누르면 빠져요.'
    : wmk === 'off' ? '휴무예요. 이 날은 키퍼 순번을 건너뛰어요. 한 번 더 누르면 빠져요.'

  el.innerHTML = `
    <div class="card">
      <div class="calbar"><button class="dn" data-act="calm" data-v="-1" aria-label="지난달">‹</button><h2>${y}년 ${m}월</h2><button class="dn" data-act="calm" data-v="1" aria-label="다음 달">›</button></div>

      ${t ? `<p class="hint">키퍼 순번 <b>${esc(nameOf(t.owner))}</b>${c.starter && c.starter.id && c.starter.sub ? ` · 빠져서 ${esc(ga(nameOf(c.starter.id)))} 대신` : ''}${t.set ? ' · 직접 정함' : ''}${t.added(t.owner) ? ' · 들어온 사람' : ''} · 다음 근무일 <b>${esc(nameOf(t.next))}</b></p>` : ''}
      <div class="workrow"><div class="btns"><button class="btn sm ghost tog" data-act="workset" data-v="on" aria-pressed="${wmk === 'on'}">특근</button><button class="btn sm ghost tog" data-act="workset" data-v="off" aria-pressed="${wmk === 'off'}">휴무</button></div><p class="hint">${workHint}</p></div>
      ${list}

    </div>
    <div class="card">
      <h3>${m}월 연·월차</h3>
      ${sum.length ? `<ul class="msum">${sum.map(([pid, n]) => `<li><b>${esc(nameOf(pid))}</b><span>${n}일</span></li>`).join('')}</ul>` : '<p class="noempty">이 달엔 아직 없어요.</p>'}
    </div>`;
}

/* ================= 시트(아래에서 올라오는 창) ================= */
let onSheetClose = null, lastFocus = null;
function openSheet(title, html, mount, onClose) {
  lastFocus = document.activeElement;
  $('#sheetTitle').textContent = title;
  const body = $('#sheetBody');
  body.onclick = null;
  body.innerHTML = html;
  $('#sheet').hidden = false;
  $('#backdrop').hidden = false;
  document.documentElement.classList.add('locked');
  onSheetClose = onClose || null;
  if (mount) mount(body);
  body.scrollTop = 0;
  setTimeout(() => { const f = body.querySelector('[data-autofocus]') || $('#sheetCloseBtn'); try { f.focus({ preventScroll: true }); } catch (e) {} }, 40);
}
function closeSheet() {
  if ($('#sheet').hidden) return;
  $('#sheet').hidden = true;
  $('#backdrop').hidden = true;
  $('#sheetBody').onclick = null;
  document.documentElement.classList.remove('locked');
  const cb = onSheetClose; onSheetClose = null;
  if (cb) cb();
  if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
}
let toastTimer = null, toastUndo = null;
function toast(msg, undo) {
  const t = $('#toast');
  toastUndo = typeof undo === 'function' ? undo : null;
  t.innerHTML = `<span>${esc(msg)}</span>${toastUndo ? '<button class="tbtn" data-act="undo">되돌리기</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; toastUndo = null; }, toastUndo ? 5000 : 2300);
}

function personChip(p, c) {
  const n = c.notes[p.id];
  const cls = ['pchip', 'r-' + RC[p.role]];
  let mark = p.role === '작업자' ? '' : p.role;
  if (n) { cls.push('has'); mark = noteLabel(n); }
  return `<button class="${cls.join(' ')}" data-s="p" data-v="${p.id}"><span class="n">${esc(p.name)}</span><span class="m">${mark ? esc(mark) : '&nbsp;'}</span></button>`;
}

function applyNote(pid) {
  const p = P.get(pid);
  if (!p) return '';
  const rs = sortNum(ui.rounds);
  if (!rs.length) return '라운드를 먼저 고르세요';
  const cur = days[ui.date] && days[ui.date].notes ? days[ui.date].notes[pid] : null;
  if (cur && cur.type === ui.type && sameArr(sortNum(cur.rounds || []), rs)) {
    editCond(d => { delete d.notes[pid]; });
    return `${p.name} ${ui.type} 뺐어요`;
  }
  editCond(d => { d.notes[pid] = { type: ui.type, rounds: rs }; });
  return `${p.name} · ${ui.type}${fmtRounds(rs) ? ' ' + fmtRounds(rs) : ''} 넣었어요`;
}

function openNoteInput() {
  let body, last = '';
  const draw = () => {
    const c = compute();
    const st = body.scrollTop;
    body.innerHTML = `
      <div class="chips" role="group" aria-label="특이사항 종류">${TYPES.map(([t]) => `<button class="chip" data-s="type" data-v="${t}" aria-pressed="${ui.type === t}">${t}</button>`).join('')}</div>
      <div class="roundrow"><span class="lbl">라운드</span><div class="seg" role="group" aria-label="빠지는 라운드">${ROUNDS.map(r => `<button data-s="round" data-v="${r}" aria-pressed="${ui.rounds.includes(r)}">${r}R</button>`).join('')}</div></div>
      ${/조퇴$/.test(ui.type) ? '<p class="hint">N R조퇴 = 그 라운드까지 일하고 빠져요. (2R조퇴 = 1R·2R 근무, 3R부터 빈자리)</p>' : ''}
      <p class="sel">${ui.rounds.length ? `<b>${esc(ui.type)} · ${fmtRounds(ui.rounds) ? fmtRounds(ui.rounds) + ' 빠짐' : '종일 빠짐'}</b> · 사람을 누르면 바로 들어가요. 같은 걸 한 번 더 누르면 빠져요.` : '<b>빠지는 라운드를 하나 이상 고르세요</b>'}</p>
      ${last ? `<p class="last">${esc(last)}</p>` : ''}
      <div class="pgrid">${base.people.map(p => personChip(p, c)).join('')}</div>
      <div class="btns foot"><button class="btn primary wide" data-act="close">다 했어요</button></div>`;
    body.scrollTop = st;
  };
  openSheet('특이사항 넣기', '', b => {
    body = b; draw();
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t) return;
      const s = t.dataset.s, v = t.dataset.v;
      if (s === 'type') { ui.type = v; ui.rounds = TYPE_DEF[v].slice(); }
      else if (s === 'round') { const r = +v; ui.rounds = ui.rounds.includes(r) ? ui.rounds.filter(x => x !== r) : sortNum([...ui.rounds, r]); }
      else if (s === 'p') { last = applyNote(v) || last; }
      draw();
    };
  }, () => render());
}

function openNoteEdit(pid) {
  const p = P.get(pid);
  const n0 = days[ui.date] && days[ui.date].notes ? days[ui.date].notes[pid] : null;
  if (!p || !n0) return;
  let type = n0.type, rounds = sortNum(n0.rounds || []), body;
  const draw = () => {
    const m = body.querySelector('#noteMemo');
    const memo = m ? m.value : (n0.memo || '');
    body.innerHTML = `
      <div class="chips">${TYPES.map(([t]) => `<button class="chip" data-s="type" data-v="${t}" aria-pressed="${t === type}">${t}</button>`).join('')}</div>
      <div class="roundrow"><span class="lbl">라운드</span><div class="seg">${ROUNDS.map(r => `<button data-s="round" data-v="${r}" aria-pressed="${rounds.includes(r)}">${r}R</button>`).join('')}</div></div>
      <label class="field"><span>메모 (선택)</span><input id="noteMemo" maxlength="20" value="${esc(memo)}" placeholder="예: 오후 병원"></label>
      <div class="btns"><button class="btn primary" data-s="save">저장</button><button class="btn danger" data-s="del">특이사항 빼기</button></div>`;
  };
  openSheet(`${p.name} · 특이사항`, '', b => {
    body = b; draw();
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t) return;
      const s = t.dataset.s;
      if (s === 'type') { type = t.dataset.v; draw(); }
      else if (s === 'round') { const r = +t.dataset.v; rounds = rounds.includes(r) ? rounds.filter(x => x !== r) : sortNum([...rounds, r]); draw(); }
      else if (s === 'save') {
        if (!rounds.length) { toast('빠지는 라운드를 하나 이상 고르세요'); return; }
