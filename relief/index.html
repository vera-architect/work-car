function renderCal() {
  const el = $('#view-cal');
  const ym = ui.calMonth || ui.date.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const startDow = new Date(y, m - 1, 1, 12).getDay(), nDays = new Date(y, m, 0).getDate();
  const today = workDayKey(), cutoff = addDays(today, -KEEP_DAYS);
  const cells = DOW.map((w, i) => `<span class="cw${i === 0 || i === 6 ? ' we' : ''}">${w}</span>`);
  for (let i = 0; i < startDow; i++) cells.push('<span class="cd blank" aria-hidden="true"></span>');
  const month = new Map();
  for (let dd = 1; dd <= nDays; dd++) {
    const k = `${y}-${pad2(m)}-${pad2(dd)}`;
    const notes = (days[k] && days[k].notes) || {};
    let lv = 0, ot = 0;
    for (const [pid, n] of Object.entries(notes)) {
      if (!P.has(pid) || !n || !TYPE_DEF[n.type]) continue;
      if (LEAVE_TYPES.includes(n.type)) { lv++; month.set(pid, (month.get(pid) || 0) + 1); } else ot++;
    }
    const dow = parseKey(k).getDay(), wm = workMark(k);
    const cls = ['cd', dow === 0 || dow === 6 ? 'we' : '', k === today ? 'today' : '', k === ui.date ? 'sel' : '', k < cutoff ? 'old' : '', lv > LEAVE_MAX ? 'over' : lv === LEAVE_MAX ? 'full' : '', wm === 'on' ? 'ex' : wm === 'off' ? 'ho' : ''].filter(Boolean).join(' ');
    cells.push(`<button class="${cls}" data-act="calday" data-v="${k}" aria-pressed="${k === ui.date}" aria-label="${fmtDay(k)}${wm ? (wm === 'on' ? ' 특근' : ' 휴무') : ''} 연·월차 ${lv}명${ot ? `, 다른 특이사항 ${ot}건` : ''}"><span class="ct"><span class="dn2">${dd}</span>${wm ? `<i class="wtag ${wm}">${wm === 'on' ? '특근' : '휴무'}</i>` : ''}</span><span class="cm">${lv ? `<b class="lv">${lv}</b>` : ''}${ot ? `<i class="ot">+${ot}</i>` : ''}</span></button>`);
  }
  const k = ui.date, c = compute(k);
  const ids = base.people.filter(p => c.notes[p.id]).map(p => p.id);
  const lvN = c.leave.length, over = lvN > LEAVE_MAX;
  const list = ids.length
    ? `<div class="notes">${ids.map(id => `<span class="nchip"><button class="ne" data-act="noteedit" data-v="${id}"><b>${esc(nameOf(id))}</b>${esc(noteLabel(c.notes[id]))}</button></span>`).join('')}</div>`
    : '<p class="noempty">특이사항이 없어요.</p>';
  const t = c.turn;
  const order = new Map(base.people.map((p, i) => [p.id, i]));
  const sum = [...month.entries()].sort((a, b) => (b[1] - a[1]) || (order.get(a[0]) - order.get(b[0])));
  const wmk = workMark(k);
  const workHint = wmk === 'on' ? '특근이에요. 이 날도 근무일로 쳐서 키퍼 순번이 이어져요. 한 번 더 누르면 빠져요.'
    : wmk === 'off' ? '휴무예요. 이 날은 키퍼 순번을 건너뛰어요. 한 번 더 누르면 빠져요.'
    : isWeekday(k) ? "평일이라 근무일이에요. 공휴일·쉬는 날이면 '휴무'를 눌러 주세요. 그날은 순번을 건너뛰어요."
    : "주말이라 순번을 건너뛰어요. 특근이면 '특근'을 눌러 주세요. 그날도 순번이 이어져요.";
  el.innerHTML = `
    <div class="card">
      <div class="calbar"><button class="dn" data-act="calm" data-v="-1" aria-label="지난달">‹</button><h2>${y}년 ${m}월</h2><button class="dn" data-act="calm" data-v="1" aria-label="다음 달">›</button></div>
      <div class="cal">${cells.join('')}</div>
      <div class="legend"><span><b class="lv">2</b>연·월차 사람 수</span><span><i class="ot">+1</i>다른 특이사항</span><span><b class="lv over">6</b>5명 넘음</span><span><i class="wtag on">특근</i>주말 근무</span><span><i class="wtag off">휴무</i>평일 쉼</span></div>
      <p class="hint">지난 기록은 ${KEEP_DAYS}일까지 남아요. 앞날은 날짜를 눌러 미리 넣어 둘 수 있어요.</p>
    </div>
    <div class="card">
      <div class="card-h"><div class="hgrp"><h2>${fmtDay(k)}</h2><span class="quota${over ? ' over' : ''}">연·월차 <b>${lvN}</b>/${LEAVE_MAX}</span></div></div>
      ${t ? `<p class="hint">키퍼 순번 <b>${esc(nameOf(t.owner))}</b>${c.starter && c.starter.id && c.starter.sub ? ` · 빠져서 ${esc(ga(nameOf(c.starter.id)))} 대신` : ''}${t.set ? ' · 직접 정함' : ''}${t.added(t.owner) ? ' · 들어온 사람' : ''} · 다음 근무일 <b>${esc(nameOf(t.next))}</b></p>` : ''}
      <div class="workrow"><div class="btns"><button class="btn sm ghost tog" data-act="workset" data-v="on" aria-pressed="${wmk === 'on'}">특근</button><button class="btn sm ghost tog" data-act="workset" data-v="off" aria-pressed="${wmk === 'off'}">휴무</button></div><p class="hint">${workHint}</p></div>
      ${list}
      <div class="btns"><button class="btn primary" data-act="noteinput">+ 특이사항 넣기</button><button class="btn ghost" data-act="tab" data-v="table">이 날 업무표 보기</button></div>
    </div>
    <div class="card">
      <h3>${m}월 연·월차</h3>
      ${sum.length ? `<ul class="msum">${sum.map(([pid, n]) => `<li><b>${esc(nameOf(pid))}</b><span>${n}일</span></li>`).join('')}</ul>` : '<p class="noempty">이 달엔 아직 없어요.</p>'}
    </div>`;
}

/* ================= 시트(아래에서 올라오는 창) ================= */
let onSheetClose = null, lastFocus = null;
function openSheet(title, html, mount, onClose) {
  lastFocus = document.activeElement;
  $('#sheetTitle').textContent = title;
  const body = $('#sheetBody');
  body.onclick = null;
  body.innerHTML = html;
  $('#sheet').hidden = false;
  $('#backdrop').hidden = false;
  document.documentElement.classList.add('locked');
  onSheetClose = onClose || null;
  if (mount) mount(body);
  body.scrollTop = 0;
  setTimeout(() => { const f = body.querySelector('[data-autofocus]') || $('#sheetCloseBtn'); try { f.focus({ preventScroll: true }); } catch (e) {} }, 40);
}
function closeSheet() {
  if ($('#sheet').hidden) return;
  $('#sheet').hidden = true;
  $('#backdrop').hidden = true;
  $('#sheetBody').onclick = null;
  document.documentElement.classList.remove('locked');
  const cb = onSheetClose; onSheetClose = null;
  if (cb) cb();
  if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
}
let toastTimer = null, toastUndo = null;
function toast(msg, undo) {
  const t = $('#toast');
  toastUndo = typeof undo === 'function' ? undo : null;
  t.innerHTML = `<span>${esc(msg)}</span>${toastUndo ? '<button class="tbtn" data-act="undo">되돌리기</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; toastUndo = null; }, toastUndo ? 5000 : 2300);
}

function personChip(p, c) {
  const n = c.notes[p.id];
  const cls = ['pchip', 'r-' + RC[p.role]];
  let mark = p.role === '작업자' ? '' : p.role;
  if (n) { cls.push('has'); mark = noteLabel(n); }
  return `<button class="${cls.join(' ')}" data-s="p" data-v="${p.id}"><span class="n">${esc(p.name)}</span><span class="m">${mark ? esc(mark) : '&nbsp;'}</span></button>`;
}

function applyNote(pid) {
  const p = P.get(pid);
  if (!p) return '';
  const rs = sortNum(ui.rounds);
  if (!rs.length) return '라운드를 먼저 고르세요';
  const cur = days[ui.date] && days[ui.date].notes ? days[ui.date].notes[pid] : null;
  if (cur && cur.type === ui.type && sameArr(sortNum(cur.rounds || []), rs)) {
    editCond(d => { delete d.notes[pid]; });
    return `${p.name} ${ui.type} 뺐어요`;
  }
  editCond(d => { d.notes[pid] = { type: ui.type, rounds: rs }; });
  return `${p.name} · ${ui.type}${fmtRounds(rs) ? ' ' + fmtRounds(rs) : ''} 넣었어요`;
}

function openNoteInput() {
  let body, last = '';
  const draw = () => {
    const c = compute();
    const st = body.scrollTop;
    body.innerHTML = `
      <div class="chips" role="group" aria-label="특이사항 종류">${TYPES.map(([t]) => `<button class="chip" data-s="type" data-v="${t}" aria-pressed="${ui.type === t}">${t}</button>`).join('')}</div>
      <div class="roundrow"><span class="lbl">라운드</span><div class="seg" role="group" aria-label="빠지는 라운드">${ROUNDS.map(r => `<button data-s="round" data-v="${r}" aria-pressed="${ui.rounds.includes(r)}">${r}R</button>`).join('')}</div></div>
      ${/조퇴$/.test(ui.type) ? '<p class="hint">N R조퇴 = 그 라운드까지 일하고 빠져요. (2R조퇴 = 1R·2R 근무, 3R부터 빈자리)</p>' : ''}
      <p class="sel">${ui.rounds.length ? `<b>${esc(ui.type)} · ${fmtRounds(ui.rounds) ? fmtRounds(ui.rounds) + ' 빠짐' : '종일 빠짐'}</b> · 사람을 누르면 바로 들어가요. 같은 걸 한 번 더 누르면 빠져요.` : '<b>빠지는 라운드를 하나 이상 고르세요</b>'}</p>
      ${last ? `<p class="last">${esc(last)}</p>` : ''}
      <div class="pgrid">${base.people.map(p => personChip(p, c)).join('')}</div>
      <div class="btns foot"><button class="btn primary wide" data-act="close">다 했어요</button></div>`;
    body.scrollTop = st;
  };
  openSheet('특이사항 넣기', '', b => {
    body = b; draw();
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t) return;
      const s = t.dataset.s, v = t.dataset.v;
      if (s === 'type') { ui.type = v; ui.rounds = TYPE_DEF[v].slice(); }
      else if (s === 'round') { const r = +v; ui.rounds = ui.rounds.includes(r) ? ui.rounds.filter(x => x !== r) : sortNum([...ui.rounds, r]); }
      else if (s === 'p') { last = applyNote(v) || last; }
      draw();
    };
  }, () => render());
}

function openNoteEdit(pid) {
  const p = P.get(pid);
  const n0 = days[ui.date] && days[ui.date].notes ? days[ui.date].notes[pid] : null;
  if (!p || !n0) return;
  let type = n0.type, rounds = sortNum(n0.rounds || []), body;
  const draw = () => {
    const m = body.querySelector('#noteMemo');
    const memo = m ? m.value : (n0.memo || '');
    body.innerHTML = `
      <div class="chips">${TYPES.map(([t]) => `<button class="chip" data-s="type" data-v="${t}" aria-pressed="${t === type}">${t}</button>`).join('')}</div>
      <div class="roundrow"><span class="lbl">라운드</span><div class="seg">${ROUNDS.map(r => `<button data-s="round" data-v="${r}" aria-pressed="${rounds.includes(r)}">${r}R</button>`).join('')}</div></div>
      <label class="field"><span>메모 (선택)</span><input id="noteMemo" maxlength="20" value="${esc(memo)}" placeholder="예: 오후 병원"></label>
      <div class="btns"><button class="btn primary" data-s="save">저장</button><button class="btn danger" data-s="del">특이사항 빼기</button></div>`;
  };
  openSheet(`${p.name} · 특이사항`, '', b => {
    body = b; draw();
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t) return;
      const s = t.dataset.s;
      if (s === 'type') { type = t.dataset.v; draw(); }
      else if (s === 'round') { const r = +t.dataset.v; rounds = rounds.includes(r) ? rounds.filter(x => x !== r) : sortNum([...rounds, r]); draw(); }
      else if (s === 'save') {
        if (!rounds.length) { toast('빠지는 라운드를 하나 이상 고르세요'); return; }
        const memo = (body.querySelector('#noteMemo').value || '').trim().slice(0, 20);
        editCond(d => { d.notes[pid] = memo ? { type, rounds, memo } : { type, rounds }; });
        closeSheet(); toast(`${p.name} · ${type} 저장했어요`);
      } else if (s === 'del') {
        editCond(d => { delete d.notes[pid]; });
        closeSheet(); toast(`${p.name} 특이사항을 뺐어요`);
      }
    };
  }, () => render());
}

function openStartSheet(pid) {
  const c = compute();
  if (!c.group.includes(pid)) { toast('오늘 빠진 사람이라 시작 자리가 없어요'); return; }
  const owner = {};
  for (const [id, s] of Object.entries(c.starts)) owner[s] = id;
  const items = c.ring.map((_, j) => (c.kpos + j) % c.L).map(i => {
    const sl = c.ring[i];
    let name, sub;
    if (sl.kind === 'keeper') { name = '키퍼'; sub = '라인 맨 뒤 최종 확인'; }
    else if (sl.kind === 'side') { name = 'X'; sub = '사이드(대기)'; }
    else { name = sl.p.name; sub = `${seatText(sl)} · ${noteLabel(sl.note)}`; }
    const mine = c.starts[pid] === i;
    const who = owner[i] !== undefined ? (mine ? '지금 여기' : P.get(owner[i]).name) : '비어 있음';
    return `<button class="slot${mine ? ' cur' : ''}${sl.kind === 'keeper' ? ' k' : ''}" data-s="slot" data-v="${i}"><span class="si">${i === c.kpos ? 'K' : (((i - c.kpos) % c.L) + c.L) % c.L}</span><span class="sn"><b>${esc(name)}</b><small>${esc(sub)}</small></span><span class="sw2">${esc(who)}</span></button>`;
  }).join('');
  openSheet(`${P.get(pid).name} · 1R 시작 자리`, `<p class="hint">고른 칸에 있던 사람과 서로 바뀌어요. 칸 번호는 키퍼(K)부터 도는 순서예요. 직접 바꾸면 그날은 규칙 대신 이 배치를 써요. 키퍼 칸으로 옮기면 그 사람이 키퍼 시작이 되고 번호가 다시 붙어요.</p><div class="slots">${items}</div>`, b => {
    b.onclick = e => {
      const t = e.target.closest('[data-s="slot"]');
      if (!t) return;
      const j = +t.dataset.v;
      const ns = Object.assign({}, c.starts);
      const other = owner[j], mine = ns[pid];
      if (j === mine) { closeSheet(); return; }
      // 키퍼 칸으로 옮기거나 키퍼를 다른 사람 칸으로 옮기면 = 키퍼 시작 바꾸기(번호 다시, 다음 근무일부터 이어짐)
      const newK = j === c.kpos ? pid : mine === c.kpos && other !== undefined ? other : null;
      if (newK) { closeSheet(); setOwner(newK, `${nameOf(newK)} 키퍼 시작 · 번호를 다시 붙였어요`); return; }
      ns[pid] = j;
      if (other !== undefined && other !== pid) ns[other] = mine;
      editDay(d => { d.starts = ns; });
      closeSheet();
    };
  }, () => render());
}

function openReliefSheet(pid) {
  const c = compute();
  const list = reliefIdsFor(c.d);
  const fillBy = new Map(Object.entries(c.fills).map(([sid, id]) => [id, findSeatById(sid)]));
  const groups = [
    ['릴리프', p => p.role === '릴리프'],
    ['그룹장·파트장', p => p.role === '그룹장' || p.role === '파트장'],
    ['작업자', p => p.role === '작업자'],
    ['인턴', p => p.role === '인턴'],
  ];
  const sec = groups.map(([title, f]) => {
    const ps = base.people.filter(f);
    if (!ps.length) return '';
    return `<h4>${title}</h4><div class="pgrid">${ps.map(p => {
      const inList = list.includes(p.id);
      const n = c.notes[p.id];
      const off = n && ROUNDS.every(r => n.rounds.includes(r));
      const s = SEAT.get(p.id);
      const fs = fillBy.get(p.id);
      const sub = p.id === pid ? '지금 이 사람' : inList ? '오늘 릴리프' : fs ? `오늘 대신 ${fs.seat.station}` : n ? noteLabel(n) : !internActive(p, c.k) ? '기간 아님' : s ? `${s.side} ${s.seat.station}` : p.role;
      const dis = inList || off || !!fs;
      return `<button class="pchip r-${RC[p.role]}${n ? ' has' : ''}${p.id === pid ? ' cur' : ''}" data-s="pick" data-v="${p.id}" ${dis ? 'disabled' : ''}><span class="n">${esc(p.name)}</span><span class="m">${esc(sub)}</span></button>`;
    }).join('')}</div>`;
  }).join('');
  const who = pid ? P.get(pid) : null;
  openSheet(who ? `${who.name} 바꾸기` : '릴리프 추가',
    `<p class="hint">${who ? '대신 넣을 사람을 고르세요. 번호는 출근부 자리대로 다시 매겨요.' : '더 넣을 사람을 고르세요. 그룹장·파트장·작업자·인턴도 넣을 수 있어요. 번호는 출근부 자리대로 매겨요.'} 작업자를 넣으면 그 사람 자리는 오늘 공석(!)이 되고, 빼면 제자리로 돌아가요.</p>${sec}
     ${who ? '<div class="btns"><button class="btn danger" data-s="remove">오늘 릴리프에서 빼기</button></div>' : ''}`, b => {
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t || t.disabled) return;
      if (t.dataset.s === 'remove') { closeSheet(); removeRelief(pid); return; }
      if (t.dataset.s !== 'pick') return;
      const id = t.dataset.v;
      const o0 = turnFor(ui.date);
      editCond(d => {
        const arr = reliefIdsFor(d).slice();
        if (pid) {
          const i = arr.indexOf(pid);
          if (i >= 0) arr[i] = id; else arr.push(id);
          if (d.starts && d.starts[pid] !== undefined) { d.starts[id] = d.starts[pid]; delete d.starts[pid]; }
          if (d.turn === pid && P.get(pid).role !== '릴리프') delete d.turn;
        } else arr.push(id);
        d.reliefs = arr;
      });
      closeSheet();
      const st = SEAT.get(id);
      toast(`${pid ? `${P.get(pid).name} → ${P.get(id).name}` : `${P.get(id).name} 릴리프로 넣었어요`}${st ? ` · ${st.side} ${st.seat.station} 오늘 공석(!)` : ''}${keeperNews(o0)}`);
    };
  }, () => render());
}
function removeRelief(pid) {
  const p = P.get(pid);
  const st = SEAT.get(pid);
  const o0 = turnFor(ui.date);
  editCond(d => {
    d.reliefs = reliefIdsFor(d).filter(x => x !== pid);
    if (d.starts) delete d.starts[pid];
    if (d.turn === pid && p && p.role !== '릴리프') delete d.turn;
    if (st && d.fills && d.fills[st.seat.id]) delete d.fills[st.seat.id]; // 제자리로 돌아오면 대신 서던 사람은 빠진다
  });
  render();
  if (p) toast(`${p.name} 오늘 릴리프에서 뺐어요${st && p.role !== '릴리프' ? ` · ${st.side} ${st.seat.station} 제자리로` : ''}${keeperNews(o0)}`);
}
// 사람을 넣고 빼서 오늘 키퍼 차례가 바뀌었으면 한마디
function keeperNews(o0) {
  const o1 = turnFor(ui.date);
  return o0 && o1 && o0.owner !== o1.owner ? ` · 오늘 키퍼 차례 ${nameOf(o1.owner)}` : '';
}

/* ---------- 자리표 ---------- */
function findSeat(side, sid) { return (base.seats[side] || []).find(s => s.id === sid) || null; }
function internName() {
  let n = '인턴', k = 2;
  const names = new Set(base.people.map(p => p.name));
  while (names.has(n)) n = '인턴' + (k++);
  return n;
}
/* ---------- 되돌리기 ---------- */
function snapDay(k = ui.date) { return { k, d: days[k] ? JSON.parse(JSON.stringify(days[k])) : null }; }
function restoreDay(s) { if (s.d) days[s.k] = s.d; else delete days[s.k]; saveDays(); render(); toast('되돌렸어요'); }
function undoBase(before) { const b = cleanBase(JSON.parse(before)); if (b) { base = b; saveBase(); render(); toast('되돌렸어요'); } }

/* ---------- 오늘만 대신 서기 ---------- */
function fillCands(c, seat) {
  const listed = new Set(c.rows.map(r => r.id));
  const filling = new Set(Object.entries(c.fills).filter(([sid]) => sid !== seat.id).map(([, pid]) => pid));
  return base.people.filter(p => {
    if (p.role === '릴리프' || listed.has(p.id) || filling.has(p.id) || p.id === seat.pid) return false;
    const n = c.notes[p.id];
    if (n && ROUNDS.every(r => n.rounds.includes(r))) return false;
    if (!internActive(p, c.k)) return false;
    if (p.role === '작업자' || p.role === '인턴') return !SEAT.has(p.id);
    return true; // 그룹장·파트장
  });
}
function setFill(seat, pid) {
  const before = snapDay();
  editCond(d => {
    d.fills = Object.assign({}, d.fills || {});
    if (pid) d.fills[seat.id] = pid; else delete d.fills[seat.id];
  });
  render();
  toast(pid ? `${nameOf(pid)} · ${seat.station} 오늘만 대신 서요` : `${seat.station} 대신 서는 사람을 뺐어요`, () => restoreDay(before));
}
function seatStatusLine(x) {
  const o = x.owner;
  if (x.fill) return `<b>${esc(x.fill.name)}</b> 오늘 대신 서요 (${o ? `${esc(o.name)} ` : ''}${esc(x.why)}).`;
  if (x.state === 'away') return `<b>${esc(o.name)}</b> ${esc(x.why)} → 오늘 공석이에요. 대신 설 사람을 고르세요.`;
  if (x.state === 'empty') return `${esc(x.why)} → 공석이에요. 오늘 대신 설 사람을 고르거나, 아래에서 자리 주인을 정하세요.`;
  if (x.state === 'absent') return `<b>${esc(o.name)}</b> ${esc(x.why)} → 릴리프가 돌며 메워요. 여기에 오늘 대신 설 사람을 넣으면 릴리프 표에서 빠져요.`;
  return '';
}

/* ---------- 자리 고르기(명단에서) · 끌어 놓을 때 고르기 ---------- */
function assignSeat(pid, side, sid) {
  const seat = findSeat(side, sid), p = P.get(pid);
  if (!seat || !p) return;
  const before = JSON.stringify(base);
  const cur = SEAT.get(pid);
  const prev = seat.pid && P.has(seat.pid) && seat.pid !== pid ? P.get(seat.pid) : null;
  if (cur && cur.seat === seat) return;
  if (cur) cur.seat.pid = prev ? prev.id : null;
  seat.pid = pid;
  saveBase(); render();
  toast(`${p.name} → ${side} ${seat.station}${prev ? (cur ? ` (${wa(prev.name)} 자리 바꿈)` : ` (${eun(prev.name)} 자리 없음)`) : ''}`, () => undoBase(before));
}
function openSeatPicker(pid, isNew) {
  const p = P.get(pid);
  if (!p) return;
  const cur = SEAT.get(pid);
  const col = side => base.seats[side].map(s => {
    const o = s.pid && P.has(s.pid) ? P.get(s.pid) : null;
    const h = !o ? homeOwner(s.id) : null;
    return `<button class="pseat${s.pid === pid ? ' cur' : ''}${!o ? ' empty' : ''}" data-s="seat" data-side="${side}" data-v="${s.id}"><span class="st">${esc(s.station)}${s.tag ? ` ${esc(s.tag)}` : ''}</span><b>${o ? esc(o.name) : '! 공석'}</b>${h ? `<small>${esc(h.name)} 자리 · ${esc(h.role)}</small>` : ''}</button>`;
  }).join('');
  openSheet(`${p.name} 자리 정하기`, `
    <p class="hint">${cur ? `지금 <b>${cur.side} ${esc(cur.seat.station)}</b>예요. ` : ''}자리를 누르면 그 자리 주인이 돼요. 그 자리에 있던 사람은 ${cur ? '서로 자리를 바꿔요' : '자리 없음이 돼요'}.</p>
    <div class="pseatcols"><div class="pscol"><h4>RH</h4>${col('RH')}</div><div class="pscol"><h4>LH</h4>${col('LH')}</div></div>
    <div class="btns">${cur ? '<button class="btn ghost" data-s="unseat">자리에서 빼기</button>' : ''}${isNew ? '<button class="btn ghost" data-s="later">나중에</button>' : ''}</div>`, b => {
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t) return;
      if (t.dataset.s === 'later') { closeSheet(); return; }
      if (t.dataset.s === 'unseat') {
        const before = JSON.stringify(base);
        if (cur) cur.seat.pid = null;
        saveBase(); closeSheet(); toast(`${p.name} 자리에서 뺐어요`, () => undoBase(before));
        return;
      }
      closeSheet();
      assignSeat(pid, t.dataset.side, t.dataset.v);
    };
  }, () => render());
}
function openDropChoice(pid, side, sid) {
  const seat = findSeat(side, sid), p = P.get(pid);
  if (!seat || !p) return;
  const c = compute();
  const x = seatInfo(c).get(seat.id);
  const o = x.owner;
  const canFill = x.state !== 'ok' && fillCands(c, seat).some(q => q.id === pid);
  openSheet(`${side} ${seat.station}에 ${p.name}`, `
    <p class="hint">${o ? `지금 자리 주인은 <b>${esc(o.name)}</b>${x.state !== 'ok' ? ` (${esc(x.why)})` : ''}이에요.` : '주인이 없는 자리예요.'}</p>
    <div class="choice">
      ${canFill ? `<button class="btn primary wide" data-s="fill">오늘만 대신 서기</button><p class="hint">${fmtDay(ui.date)} 하루만 이 자리에 서요. 로테이션은 그대로예요.</p>` : ''}
      <button class="btn wide" data-s="own">로테이션 자리 주인으로</button><p class="hint">${o ? `${esc(eun(o.name))} 자리 없음이 돼요.` : '이 자리 주인이 돼요.'}</p>
    </div>`, b => {
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t) return;
      closeSheet();
      if (t.dataset.s === 'fill') setFill(seat, pid); else assignSeat(pid, side, sid);
    };
  });
}

function openSeatSheet(side, sid, openMore) {
  const seat = findSeat(side, sid);
  if (!seat) return;
  let armed = false, body;
  const draw = () => {
    const c = compute();
    const x = seatInfo(c).get(seat.id);
    const more = body.querySelector('details.more');
    const moreOpen = more ? more.open : !!openMore;
    const cur = seat.pid && P.has(seat.pid) ? P.get(seat.pid) : null;
    let today = '';
    if (x.state !== 'ok' || x.fill) {
      const cands = fillCands(c, seat);
      today = `
      <div class="todaybox">
        <h4>${fmtDay(ui.date)} · 오늘만</h4>
        <p class="hint">${seatStatusLine(x)}</p>
        ${cands.length ? `<div class="pgrid">${cands.map(p => `<button class="pchip r-${RC[p.role]}${x.fill && x.fill.id === p.id ? ' cur' : ''}" data-s="fill" data-v="${p.id}"><span class="n">${esc(p.name)}</span><span class="m">${esc(p.role === '작업자' ? '자리 없음' : p.role)}</span></button>`).join('')}</div>` : '<p class="hint">대신 설 수 있는 사람이 없어요(자리 없는 작업자·인턴, 파트장, 그룹장).</p>'}
        ${x.fill ? '<div class="btns"><button class="btn ghost sm" data-s="unfill">대신 서는 사람 빼기</button></div>' : ''}
      </div>`;
    }
    const cands = base.people.filter(p => p.role === '작업자' || p.role === '인턴');
    const chips = cands.map(p => {
      const s = SEAT.get(p.id);
      const here = seat.pid === p.id;
      const where = here ? '지금 이 자리' : s ? `${s.side} ${s.seat.station}` : '자리 없음';
      return `<button class="pchip r-${RC[p.role]}${here ? ' cur' : ''}" data-s="pick" data-v="${p.id}"><span class="n">${esc(p.name)}</span><span class="m">${esc(p.role === '인턴' ? '인턴 · ' + where : where)}</span></button>`;
    }).join('');
    const h = !cur ? homeOwner(seat.id) : null;
    body.innerHTML = `
      ${today}
      <h4>로테이션 자리 주인</h4>
      <p class="hint">지금: <b>${cur ? esc(cur.name) : '비어 있음'}</b>${h ? ` · 원래 ${esc(h.name)} 자리(${esc(h.role)})` : ''}${seat.tag ? ` · 표시 ${esc(seat.tag)}` : ''}. 다른 자리에 있는 사람을 고르면 서로 바뀌어요.</p>
      <div class="pgrid">${chips || '<p class="noempty">작업자가 없어요.</p>'}</div>
      <div class="inrow"><input id="internInput" maxlength="12" placeholder="인턴 이름 (몰라도 돼요)" aria-label="인턴 이름"><button class="btn" data-s="intern">인턴 넣기</button></div>
      <div class="btns"><button class="btn ghost" data-s="clear" ${cur ? '' : 'disabled'}>비워 두기</button></div>
      <details class="more"${moreOpen ? ' open' : ''}><summary>자리 이름·표시 고치기</summary>
        <div class="in">
          <label class="field"><span>자리 이름</span><input id="seatStation" maxlength="20" value="${esc(seat.station)}"></label>
          <label class="field"><span>표시 (①, HOLD, ★, ■ 등)</span><input id="seatTag" maxlength="12" value="${esc(seat.tag)}"></label>
          <label class="check"><input type="checkbox" id="seatHold" ${seat.hold ? 'checked' : ''}> 회색 칸 (고정 자리)</label>
          <div class="btns"><button class="btn primary" data-s="info">저장</button><button class="btn ghost" data-s="up">▲ 위로</button><button class="btn ghost" data-s="down">▼ 아래로</button></div>
          <div class="btns"><button class="btn danger" data-s="delseat">${armed ? '한 번 더 누르면 자리 삭제' : '이 자리 삭제'}</button></div>
        </div>
      </details>`;
  };
  openSheet(`${side} · ${seat.station || '자리'}`, '', b => {
    body = b; draw();
    b.onclick = e => {
      const t = e.target.closest('[data-s]');
      if (!t || t.disabled) return;
      const s = t.dataset.s;
      if (s === 'fill') { closeSheet(); setFill(seat, t.dataset.v); }
      else if (s === 'unfill') { closeSheet(); setFill(seat, null); }
      else if (s === 'pick') {
        const pid = t.dataset.v;
        if (seat.pid === pid) { closeSheet(); return; }
        closeSheet();
        assignSeat(pid, side, seat.id);
      } else if (s === 'intern') {
        const raw = (body.querySelector('#internInput').value || '').trim().slice(0, 12);
        const exist = raw ? base.people.find(p => p.name === raw) : null;
        if (exist && exist.role !== '인턴') { toast('같은 이름이 명단에 있어요. 위 목록에서 고르세요'); return; }
        const before = JSON.stringify(base);
        let p = exist;
        if (!p) { p = { id: uid(), name: raw || internName(), role: '인턴' }; base.people.push(p); reindex(); }
        const other = SEAT.get(p.id);
        if (other && other.seat !== seat) other.seat.pid = null;
        seat.pid = p.id;
        saveBase(); closeSheet(); toast(`${p.name}(인턴) → ${side} ${seat.station} · 기간은 명단에서 정해요`, () => undoBase(before));
      } else if (s === 'clear') {
        const before = JSON.stringify(base);
        seat.pid = null; saveBase(); closeSheet(); toast('자리를 비웠어요', () => undoBase(before));
      } else if (s === 'info') {
        seat.station = (body.querySelector('#seatStation').value || '').trim().slice(0, 20) || seat.station;
        seat.tag = (body.querySelector('#seatTag').value || '').trim().slice(0, 12);
        seat.hold = body.querySelector('#seatHold').checked;
        saveBase(); closeSheet(); toast('자리 정보를 저장했어요');
      } else if (s === 'up' || s === 'down') {
        const arr = base.seats[side], i = arr.indexOf(seat), j = s === 'up' ? i - 1 : i + 1;
        if (j < 0 || j >= arr.length) { toast(s === 'up' ? '맨 위예요' : '맨 아래예요'); return; }
        [arr[i], arr[j]] = [arr[j], arr[i]];
        saveBase(); renderSeats(); draw();
      } else if (s === 'delseat') {
        if (!armed) { armed = true; draw(); return; }
        base.seats[side] = base.seats[side].filter(x => x !== seat);
        for (const p of base.people) if (p.home === seat.id) delete p.home;
        saveBase(); closeSheet(); toast('자리를 삭제했어요');
      }
    };
  }, () => render());
}

function addSeat(side) {

}

/* ---------- 명단 ---------- */
function openPersonSheet(pid) {
  const p = pid ? P.get(pid) : null;
  if (pid && !p) return;
  let role = p ? p.role : '작업자', armed = false, body;

    const name = val('#pName', p ? p.name : '');
    const from = val('#pFrom', (p && p.from) || ''), to = val('#pTo', (p && p.to) || '');

        } else if (seated && p.home) {
          const h = findSeatById(p.home);
          if (h && !st) {

            h.seat.pid = p.id;
            msg = ` · 제자리 ${h.side} ${h.seat.station}로 돌아갔어요${prev ? ` (${eun(prev.name)} 자리 없음)` : ''}`;

        base.people = base.people.filter(x => x !== p);
        if (base.backup === p.id) base.backup = null;
        saveBase(); closeSheet(); toast(`${p.name} 명단에서 뺐어요`);
      }
    };
  }, () => render());
}

/* ---------- 코드로 명단 나누기 ---------- */
function toB64url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64url(s) {
  let b = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  const bin = atob(b);
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}
function encodeBase() {
  const idx = new Map(base.people.map((p, i) => [p.id, i]));
  const seat = s => [s.station, s.tag, s.hold ? 1 : 0, s.pid && idx.has(s.pid) ? idx.get(s.pid) : -1];
  const today = workDayKey(), o = turnCache().first ? ownerAt(today) : null;
  const a = o && o.owner ? { date: today, pid: o.owner } : null; // 받는 사람은 들어온 사람 기록이 없으니 오늘 차례를 기준으로
  const homes = [];
  base.people.forEach((p, i) => {
    if (!p.home) return;
    for (const [k, side] of [['R', 'RH'], ['L', 'LH']]) { const j = base.seats[side].findIndex(st => st.id === p.home); if (j >= 0) homes.push([i, k, j]); }
  });
  const obj = { v: 1, r: base.rotation, p: base.people.map(p => (p.role === '인턴' && (p.from || p.to) ? [p.name, ROLES.indexOf(p.role), p.from || '', p.to || ''] : [p.name, ROLES.indexOf(p.role)])), s: { R: base.seats.RH.map(seat), L: base.seats.LH.map(seat) }, h: homes,
    t: a && idx.has(a.pid) ? [a.date, idx.get(a.pid)] : null, w: base.shift ? [base.shift.week, base.shift.kind] : null, b: base.backup && idx.has(base.backup) ? idx.get(base.backup) : -1 };
  return 'RLF1.' + toB64url(JSON.stringify(obj));
}
function decodeCode(text) {
  const m = String(text || '').match(/RLF1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error('RLF1.로 시작하는 코드를 찾지 못했어요');
  let obj;
  try { obj = JSON.parse(fromB64url(m[1])); } catch (e) { throw new Error('코드가 잘렸거나 바뀌었어요. 처음부터 끝까지 다시 복사해 주세요'); }
  if (!obj || obj.v !== 1 || !Array.isArray(obj.p) || !obj.s || !Array.isArray(obj.s.R) || !Array.isArray(obj.s.L)) throw new Error('명단 코드 형식이 아니에요');
  const oldId = new Map(base.people.map(p => [p.name, p.id]));
  const usedIds = new Set();
  const people = [];
  for (const it of obj.p) {
    if (!Array.isArray(it)) continue;
    const name = String(it[0] || '').trim().slice(0, 12);
    if (!name || people.some(p => p.name === name)) continue;
    let id = oldId.get(name);
    if (!id || usedIds.has(id)) id = uid() + people.length;
    usedIds.add(id);
    const np = { id, name, role: ROLES[it[1]] || '작업자' };
    if (np.role === '인턴') { if (/^\d{4}-\d{2}-\d{2}$/.test(String(it[2] || ''))) np.from = it[2]; if (/^\d{4}-\d{2}-\d{2}$/.test(String(it[3] || ''))) np.to = it[3]; }
    people.push(np);
  }
  const mapSeat = (side, arr) => arr.filter(Array.isArray).map((it, i) => ({
    id: side + '-' + i + '-' + Math.random().toString(36).slice(2, 6),
    station: String(it[0] || '').slice(0, 20), tag: String(it[1] || '').slice(0, 12), hold: !!it[2],
    pid: Number.isInteger(it[3]) && it[3] >= 0 && obj.p[it[3]] ? (people.find(p => p.name === String(obj.p[it[3]][0] || '').trim()) || {}).id || null : null,
  }));
  const pidAt = i => (Number.isInteger(i) && i >= 0 && obj.p[i] ? (people.find(p => p.name === String(obj.p[i][0] || '').trim()) || {}).id || null : null);
  const sameName = id => (id && P.has(id) ? (people.find(p => p.name === P.get(id).name) || {}).id || null : null);
  let turn = Array.isArray(obj.t) && /^\d{4}-\d{2}-\d{2}$/.test(String(obj.t[0])) && pidAt(obj.t[1]) ? { date: String(obj.t[0]), pid: pidAt(obj.t[1]) } : null;
  if (!turn && base.turn && sameName(base.turn.pid)) turn = { date: base.turn.date, pid: sameName(base.turn.pid) };
  const backup = obj.b !== undefined ? pidAt(obj.b) : sameName(base.backup);
  const seats = { RH: mapSeat('R', obj.s.R), LH: mapSeat('L', obj.s.L) };
  if (Array.isArray(obj.h)) for (const h of obj.h) {
    if (!Array.isArray(h)) continue;
    const pp = pidAt(h[0]), st = (h[1] === 'R' ? seats.RH : seats.LH)[h[2]];
    const person = pp ? people.find(p => p.id === pp) : null;
    if (person && st && !st.pid) person.home = st.id;
  }
  const shift = Array.isArray(obj.w) && /^\d{4}-\d{2}-\d{2}$/.test(String(obj.w[0])) && (obj.w[1] === '주간' || obj.w[1] === '야간') ? { week: String(obj.w[0]), kind: obj.w[1] } : (base.shift || null);
  return { v: 3, rotation: String(obj.r || '').slice(0, 20), people, seats, turn, backup, shift };
}

}

/* ---------- 카톡용 글 ---------- */
function tableText() {
  const c = compute();
  const out = [`[릴리프 업무표] ${fmtDay(ui.date)}${workMark(ui.date) === 'on' ? ' 특근' : ''}`];
  if (c.starter && c.starter.id) out.push(`키퍼 시작: ${nameOf(c.starter.id)}${c.starter.sub && c.turn ? ` (${nameOf(c.turn.owner)} 차례 대신)` : c.turn && c.turn.set ? ' (직접 정함)' : ''}`);
  const noteItems = base.people.filter(p => c.notes[p.id]).map(p => `${p.name} ${noteLabel(c.notes[p.id])}`);
  out.push(noteItems.length ? `특이사항: ${noteItems.join(' · ')}` : '특이사항: 없음');
  out.push('', '1R → 2R → 3R → 4R');
  for (const g of c.grid) {
    if (!g.cells) { out.push(`${g.row.p.name}: ${noteLabel(g.row.note)} (오늘 빠짐)`); continue; }
    out.push(`${g.row.p.name}(${g.n}): ${g.cells.map(cellText).join(' → ')}`);
  }
  const gl = c.gaps.map((m, i) => m.length ? `${i + 1}R ${m.map(x => x.kind === 'keeper' ? '키퍼' : x.p.name).join(',')}` : '').filter(Boolean);
  if (gl.length) out.push('', `못 메운 자리: ${gl.join(' / ')}`);
  const ns = needSeats(c);
  if (ns.length) out.push(`채워야 할 자리: ${ns.map(x => `${x.side} ${x.seat.station}(${x.owner ? x.owner.name + ' ' : ''}${x.why})`).join(', ')}`);
  const fl = Object.entries(c.fills).map(([sid, pid]) => { const f = findSeatById(sid); return f ? `${f.side} ${f.seat.station} ${nameOf(pid)}` : ''; }).filter(Boolean);
  if (fl.length) out.push(`오늘 대신: ${fl.join(', ')}`);
  out.push('', 'X = 사이드(대기) · 괄호 = 오늘 번호');
  return out.join('\n');
}

async function copyTableText() {
  const text = tableText();
  if (navigator.share && !inFrame) {
    try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (await copyText(text, '업무표를 글로 복사했어요. 카톡에 붙여 넣으세요')) return;
  openSheet('업무표 글', `<p class="hint">글자를 길게 눌러 전부 선택한 뒤 복사하세요.</p><textarea rows="12" readonly id="shareOut">${esc(text)}</textarea>`, b => {
    const ta = b.querySelector('#shareOut'); ta.focus(); ta.select();
  });
}

/* ---------- 업무표 사진 (종이 표처럼 굵은 격자, 밝은 색으로 고정) ---------- */

  if (gl.length) foot.push([IMG.absent, `못 메운 자리: ${gl.join(' / ')}`]);

      const cx = tx + nameW + colW * i, mid = cx + colW / 2;

}
async function shareTable() {
  const c = compute();
  if (!c.rows.length) return;
  markSent();
  let cv = null;
  try { cv = await tableCanvas(c); } catch (e) { cv = null; }
  if (!cv) { copyTableText(); return; }
  const name = `릴리프_업무표_${ui.date}.png`;
  if (!inFrame && navigator.canShare && navigator.share) {
    try {
      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      const file = blob ? new File([blob], name, { type: 'image/png' }) : null;
      if (file && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: `릴리프 업무표 ${fmtDay(ui.date)}` });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = cv.toDataURL('image/png');
  openSheet('업무표 사진', `
    <img class="shot" id="shotImg" src="${url}" alt="${fmtDay(ui.date)} 릴리프 업무표 사진">
    <p class="hint">사진을 길게 눌러 저장하거나 복사한 뒤 카톡에서 보내세요.${inFrame ? ' 공개 주소에서 열면 버튼 하나로 카톡 공유 창이 떠요.' : ''}</p>
    <div class="btns">${inFrame ? '' : `<a class="btn" href="${url}" download="${esc(name)}">사진 저장</a>`}<button class="btn ghost" data-s="text">글로 복사</button></div>`, b => {
    b.onclick = e => { if (e.target.closest('[data-s="text"]')) { closeSheet(); copyTableText(); } };
  });
}

/* ================= 길게 눌러 끌기 =================
   data-drag 가 붙은 칸을 0.4초 누르고 있으면 집어 들고, data-drop 칸 위에서 놓으면 옮긴다.

  if (a === 'rk') return b === 'rk' && tgt.dataset.pid !== src.dataset.pid && (!!src.dataset.zero || !!tgt.dataset.zero);
  if (a === 'tc') return b === 'tc' && tgt.dataset.pid !== src.dataset.pid && (!!src.dataset.own || !!tgt.dataset.own);

  if (DR.el.closest && DR.el.closest('#ringBox')) { stopRingPlay(); if (lastC) placeRing(lastC, ui.ringR, ui.ringR, false); }

function dropDone(src, tgt) {

    // 명단 순서(출근부) 바꾸기: 끈 사람이 놓은 사람 자리로 들어간다. 키퍼 순번·번호·빈자리 순서가 다 따라 바뀐다
    const from = base.people.findIndex(p => p.id === src.dataset.pid), to = base.people.findIndex(p => p.id === tgt.dataset.pid);
    if (from < 0 || to < 0) return;
    const before = JSON.stringify(base);
    const [p] = base.people.splice(from, 1);
    base.people.splice(to, 0, p);
    saveBase(); render();
    toast(`${p.name} → ${to + 1}번째로 옮겼어요`, () => undoBase(before));
    return;
  }
  if (a === 'rk' || a === 'tc' || (a === 'rtag' && (src.dataset.zero || tgt.dataset.zero))) {
    // 오늘 릴리프 키퍼 줄 · 근거 순번 줄 맨 앞 · 원 그림 0번 이름표: 끌어 놓은 사람(또는 키퍼를 놓은 자리의 사람)이 오늘 차례
    //  → 번호를 다시 붙이고, 다음 근무일부터 그 사람 다음으로 이어진다
    const top = a === 'tc' ? src.dataset.own : src.dataset.zero;
    const newK = top ? tgt.dataset.pid : src.dataset.pid;
    setOwner(newK, a === 'tc' ? `${nameOf(newK)} 오늘 차례` : `${nameOf(newK)} 키퍼 시작 · 번호를 다시 붙였어요`);
    return;
  }
  if (a === 'rtag') {
    // 원 그림 이름표끼리: 두 사람 자리(하루 동안 도는 길)를 맞바꾼다
    const p1 = src.dataset.pid, p2 = tgt.dataset.pid, c0 = compute();
    if (c0.starts[p1] === undefined || c0.starts[p2] === undefined) return;

    render();

    return;

    const i = +src.dataset.i, j = +tgt.dataset.i, c0 = compute();

      if (sameArr(refs, c0.autoRefs)) delete d.ring; else d.ring = refs;

    });

    return;
  }
  if (a === 'duty') {
    const r = src.dataset.r, p1 = src.dataset.pid, p2 = tgt.dataset.pid;
    const before = snapDay();
    editDay(d => {
      d.swaps = d.swaps && typeof d.swaps === 'object' ? d.swaps : {};
      d.swaps[r] = Array.isArray(d.swaps[r]) ? d.swaps[r] : [];
      d.swaps[r].push([p1, p2]);

    render();
    toast(`${r}R ${nameOf(p1)} ↔ ${nameOf(p2)} 칸을 바꿨어요`, () => restoreDay(before));

  }

    const s1 = findSeat(src.dataset.side, src.dataset.sid), s2 = findSeat(tgt.dataset.side, tgt.dataset.sid);
    if (!s1 || !s2) return;
    const before = JSON.stringify(base);
    const n1 = nameOf(s1.pid), n2 = s2.pid ? nameOf(s2.pid) : '';

    return;
  }
  if (a === 'seat' && b === 'pool') {
    const s1 = findSeat(src.dataset.side, src.dataset.sid);
    if (!s1 || !s1.pid) return;
    const before = JSON.stringify(base);
    const n1 = nameOf(s1.pid);
    s1.pid = null;
    saveBase(); render();
    toast(`${n1} 자리에서 뺐어요 · ${s1.station} 공석`, () => undoBase(before));
    return;
  }

  switch (act) {
    case 'tab': ui.tab = v; if (v === 'cal') ui.calMonth = ui.date.slice(0, 7); persistUi(); render(); window.scrollTo(0, 0); break;
    case 'seatday': ui.date = addDays(ui.date, +v); ui.ringR = 1; render(); break;
    case 'gotoseats': ui.tab = 'seats'; persistUi(); render(); window.scrollTo(0, 0); break;
    case 'calm': { const [y, m] = (ui.calMonth || ui.date.slice(0, 7)).split('-').map(Number); const dt = new Date(y, m - 1 + (+v), 1, 12); ui.calMonth = `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}`; render(); break; }
    case 'calday': ui.date = v; ui.ringR = 1; ui.calMonth = v.slice(0, 7); render(); break;
    case 'swapreset': { const before = snapDay(); editDay(d => { delete d.swaps; }); render(); toast('옮긴 칸을 되돌렸어요', () => restoreDay(before)); break; }
    case 'undo': { const f = toastUndo; toastUndo = null; $('#toast').hidden = true; if (f) f(); break; }
    case 'day': ui.date = addDays(ui.date, +v); ui.ringR = 1; render(); break;
    case 'today': ui.date = workDayKey(); ui.ringR = 1; render(); break;
    case 'reset': openReset(); break;
    case 'close': closeSheet(); break;
    case 'noteinput': openNoteInput(); break;
    case 'noteedit': openNoteEdit(v); break;
    case 'unnote': {
      const p = P.get(v);
      editCond(d => { delete d.notes[v]; });
      render();
      if (p) toast(`${p.name} 특이사항을 뺐어요`);
      break;
    }
    case 'start': openStartSheet(v); break;
    case 'turn': shiftTurn(+v); break;
    case 'turnauto': setOwner(null, '키퍼 순번을 자동으로 되돌렸어요'); break;
    case 'ringauto': {
      // 원 순서를 규칙대로. 사람 자리를 직접 바꿨으면 각자 자기 칸을 따라 옮긴다
      const c0 = compute(), before = snapDay();
      const mref = c0.ring.map(ringRef), aref = c0.autoRefs, map = {};
      const xa = aref.map((r, i) => (r === 'X' ? i : -1)).filter(i => i >= 0);
      let xk = 0;
      mref.forEach((r, i) => { map[i] = r === 'X' ? xa[xk++] : aref.indexOf(r); });
      editDay(d => { delete d.ring; if (d.starts) { const s = {}; for (const [id, p] of Object.entries(c0.starts)) s[id] = map[p]; d.starts = s; } });
      render();
      toast('원 순서를 규칙대로 되돌렸어요', () => restoreDay(before));
      break;
    }
    case 'ringr': { stopRingPlay(); const from = ui.ringR; ui.ringR = +v; if (lastC) placeRing(lastC, from, ui.ringR, true); break; }
    case 'ringplay': toggleRingPlay(); break;
    case 'addbackup': addBackup(); break;
    case 'workset': setWork(v); break;
    case 'kauto': setOwner(null, '키퍼를 순번대로 되돌렸어요'); break;
    case 'share': shareTable(); break;
    case 'sharetext': markSent(); copyTableText(); break;
    case 'lockat': editDay(d => { if (d.plan) d.plan.at = Math.max(1, Math.min(5, (Number(d.plan.at) || 1) + (+v))); }); render(); break;
    case 'replan': { const before = snapDay(); editDay(d => { delete d.plan; delete d.swaps; }); render(); toast('처음부터 다시 짰어요', () => restoreDay(before)); break; }
    case 'shiftset': base.shift = { week: weekStart(workDayKey()), kind: v }; saveBase(); render(); toast(`이번 주를 ${v}으로 맞췄어요`); break;
    case 'relief': openReliefSheet(v); break;
    case 'unrelief': removeRelief(v); break;
    case 'addrelief': openReliefSheet(null); break;
    case 'defrelief': editCond(d => { delete d.reliefs; delete d.starts; }); render(); toast('기본 릴리프로 되돌렸어요'); break;
    case 'autostart': editDay(d => { delete d.starts; }); render(); toast('규칙대로 되돌렸어요'); break;
    case 'seat': openSeatSheet(b.dataset.side, v); break;
    case 'addseat': addSeat(v); break;
    case 'rotlabel': openRotLabel(); break;
    case 'pedit': openPersonSheet(v); break;
    case 'addperson': openPersonSheet(null); break;
    case 'export': openExport(); break;
    case 'import': openImport(''); break;
    case 'history': openHistory(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'dateInput' && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { ui.date = e.target.value; ui.ringR = 1; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

purge();
render();
if (!store.ok) toast('이 화면에서는 저장이 안 돼요');
try {
  const h = location.hash || '';
  if (/^#RLF1\./.test(h)) {
    openImport(h.slice(1));
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
} catch (e) {}
})();
</script>
</body>
</html>
